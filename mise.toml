min_version = "2026.10.11"

[tools]
just = "latest"
shfmt = "latest"
# The registry's actionlint entry is deprecated.
"aqua:rhysd/actionlint" = "latest"
shellcheck = "latest"
zizmor = "latest"
yq = "latest"
jq = "latest"
gitleaks = "latest"
lychee = "latest"
"pypi:check-jsonschema" = "latest"
uv = "latest"
ruff = "latest"
# Pre-push's `lint` runs tsc and pyright on it, as CI's setup-npm reads `.nvmrc`'s.
node = "latest"
cargo-binstall = "latest"
cargo-deny = "latest"
cargo-insta = "latest"
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
"aqua:taiki-e/cargo-llvm-cov" = "latest"
"github:taiki-e/cargo-hack" = "latest"
"github:bnjbvr/cargo-machete" = "latest"
"cargo:cargo-semver-checks" = "latest"
# v27.1.0 ships no aarch64-apple-darwin asset, so `github:` fails on Apple
# silicon (https://github.com/sourcefrog/cargo-mutants/releases/tag/v27.1.0).
"cargo:cargo-mutants" = "latest"
# `cargo set-version --workspace` (docs/CONTRIBUTING.md#releasing).
"cargo:cargo-edit" = "latest"
# The version gen-wasm's sha256 check covers.
"aqua:WebAssembly/binaryen" = "133"
