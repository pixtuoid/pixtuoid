name: 'Setup Tools'
description: 'Installs the newest just plus the given mise.toml tools via mise'

inputs:
  tools:
    description: 'Space-separated mise.toml [tools] keys to install beside just'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Limits mise to these tools: unlisted ones are never resolved, so a
    # versions-host outage cannot burn the job token's API budget.
    - shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: | # zizmor: ignore[github-env] the callers' `tools:` literals, never event data
        set -euo pipefail
        echo "MISE_ENABLE_TOOLS=just${TOOLS:+,${TOOLS// /,}}" >>"$GITHUB_ENV"
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        # It exports the tool dirs itself; a shim errors outside the repo, and
        # the hermetic sandbox runs CLIs in temp dirs.
        add_shims_to_path: false
        # The default key leaves out MISE_ENABLE_TOOLS.
        cache_key: '{{default}}-${{ inputs.tools }}'
        # As setup-cargo-just's: only main's copy is ever restored by others.
        cache_save: ${{ github.ref == 'refs/heads/main' }}
        # A hit still resolves `latest` and downloads any newer release.
        cache_max_age_days: 1
