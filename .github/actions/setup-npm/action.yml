name: 'Setup npm project'
description: 'Node + pinned npm + npm ci for one npm project'

inputs:
  directory:
    description: 'The project directory, holding package.json and package-lock.json'
    required: true
  node-version-file:
    description: 'The file naming the project''s Node (the default is the repository''s); feeds setup-node and the output below'
    default: '.nvmrc'

outputs:
  node-version:
    description: 'The Node in effect — withastro/action runs its own Node setup and would otherwise pick a different one'
    value: ${{ steps.node.outputs.node-version }}

runs:
  using: 'composite'
  steps:
    - id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: npm
        cache-dependency-path: ${{ inputs.directory }}/package-lock.json
    # A Node major's bundled npm can predate the complete allowScripts
    # toolchain, so pin it before npm ci or install-script policy goes
    # unenforced. The site's `packageManager` is the repo's one npm version.
    - name: Install pinned npm
      shell: bash
      run: npm install --global "$(jq -r .packageManager site/package.json)" # zizmor: ignore[adhoc-packages] exact packageManager bootstrap before the lockfile install
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: npm ci
