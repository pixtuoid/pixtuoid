name: Packaging build
description: Homebrew's own build and test of pixtuoid.rb, the formula homebrew-core is held to, from this tree

runs:
  using: composite
  steps:
    - name: brew install and brew test pixtuoid.rb from this tree
      shell: bash
      env:
        TAP: pixtuoid/packaging
      run: |
        set -euo pipefail
        # The Ubuntu image keeps Homebrew off PATH (actions/runner-images
        # images/ubuntu/Ubuntu2404-Readme.md, "Homebrew note").
        if [[ $RUNNER_OS == Linux ]]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
        # The images set HOMEBREW_NO_AUTO_UPDATE, and homebrew-core's test-bot
        # runs Homebrew/brew's HEAD, which only a developer's update reaches
        # (Homebrew/brew Library/Homebrew/cmd/update.sh:595-601).
        HOMEBREW_DEVELOPER=1 brew update
        version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
        # A tag's tarball is its `git archive` (docs.github.com/en/repositories/
        # working-with-files/using-files/downloading-source-code-archives), and
        # its name gives `test do` the version it asserts.
        tarball="$RUNNER_TEMP/pixtuoid-$version.tar.gz"
        git archive --format=tar.gz --prefix="pixtuoid-$version/" -o "$tarball" HEAD
        sha="$(shasum -a 256 "$tarball" | cut -d' ' -f1)"
        brew tap-new --no-git "$TAP"
        # url and sha256 go where the autobump writes them; pixtuoid.rb leaves both to it.
        awk -v url="file://$tarball" -v sha="$sha" \
          '{ print } /^  homepage / { print "  url \"" url "\""; print "  sha256 \"" sha "\"" }' \
          "$GITHUB_ACTION_PATH/pixtuoid.rb" >"$(brew --repository "$TAP")/Formula/pixtuoid.rb"
        brew install --build-from-source "$TAP/pixtuoid"
        brew test --verbose "$TAP/pixtuoid"
