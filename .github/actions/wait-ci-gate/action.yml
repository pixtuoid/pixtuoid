name: 'Wait for ci-gate'
description: 'Blocks until ci.yml''s gate passes at a commit, and fails on any other conclusion'

inputs:
  sha:
    description: 'The commit whose ci-gate to wait for'
    required: true

runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        CHECK_NAME: ci-gate
        GH_TOKEN: ${{ github.token }}
        POLL_SECONDS: 30
        REPOSITORY: ${{ github.repository }}
        SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        while :; do
          # Actions' run alone, as branch protection requires: another app
          # can post a check by the same name.
          if ! verdict="$(gh api "repos/$REPOSITORY/commits/$SHA/check-runs?check_name=$CHECK_NAME&filter=latest" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | max_by(.started_at)
              | if . == null then "absent" elif .status != "completed" then "pending" else .conclusion end')"; then
            echo "::warning::could not read $CHECK_NAME at ${SHA::7}; retrying"
            verdict=pending
          fi
          case "$verdict" in
          success)
            echo "$CHECK_NAME passed at ${SHA::7}"
            exit 0
            ;;
          absent | pending) sleep "$POLL_SECONDS" ;;
          *)
            echo "::error::$CHECK_NAME concluded $verdict at ${SHA::7}, so nothing is published. Re-run this workflow once a ci.yml re-run passes"
            exit 1
            ;;
          esac
        done
