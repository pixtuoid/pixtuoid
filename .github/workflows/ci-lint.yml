name: ci-lint

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: rustfmt
          enable-cache: 'false'
      - run: just fmt-check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: clippy
      - run: just clippy

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      # No setup-cargo-just: nothing compiles here, so the runner's preinstalled
      # cargo is enough — but cargo-deny DOES shell out to `cargo metadata`.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny
      - uses: ./.github/actions/setup-just
      - run: just deny
      # Both verdicts show: a red deny must not hide arch.
      - if: ${{ !cancelled() }}
        run: just arch
      - uses: ./.github/actions/path-changed
        id: lockfile
        with:
          # deny.toml decides the verdict as much as the graph does.
          paths: Cargo.lock deny.toml
      - if: steps.lockfile.outputs.changed == 'true'
        run: just deny-advisories

  machete:
    name: unused deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # cargo-machete parses manifests and does not need a Rust toolchain.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-machete
      - uses: ./.github/actions/setup-just
      - run: just machete

  # The `just lint` recipes no other job runs, so a skipped local preflight can't land their break.
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The tools this job installs run at their newest release, as the brew
      # copies `just lint` uses locally do. The Go ones build from source, so
      # the cache is keyed on the releases they resolve to and on this file,
      # which holds the recipe: a new release or a changed recipe misses it.
      - name: Resolve the Go tools' newest releases
        id: go-latest
        run: |
          versions="$(go list -m -f '{{.Path}}@{{.Version}}' mvdan.cc/sh/v3@latest github.com/rhysd/actionlint@latest github.com/mikefarah/yq/v4@latest github.com/zricethezav/gitleaks/v8@latest)"
          echo "versions=${versions//$'\n'/ }" >>"$GITHUB_OUTPUT"
      # ~/go/bin is spelled, not derived: GOPATH is the runner default, and
      # deriving it here while the cache stores a literal is how a hit could
      # restore binaries to a directory that is not on PATH.
      - name: Cache the Go-built tools
        id: go-tools
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('.github/workflows/ci-lint.yml') }}-${{ steps.go-latest.outputs.versions }}
      - name: Expose Go tool binaries
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install the Go-built tools
        if: steps.go-tools.outputs.cache-hit != 'true'
        env:
          VERSIONS: ${{ steps.go-latest.outputs.versions }}
        run: |
          for v in $VERSIONS; do
            case "$v" in
              mvdan.cc/sh/v3@*) go install "mvdan.cc/sh/v3/cmd/shfmt@${v#*@}" ;;
              github.com/rhysd/actionlint@*) go install "github.com/rhysd/actionlint/cmd/actionlint@${v#*@}" ;;
              *) go install "$v" ;;
            esac
          done
      # From PyPI, which carries each one's newest release; install-action
      # would serve the one in the manifest its pinned ref bundles.
      - name: Install the Python-packaged tools
        run: pipx install check-jsonschema zizmor shellcheck-py
      # Lychee is not manifest-managed by install-action; its documented
      # cargo-binstall fallback installs its newest release.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: lychee
          fallback: cargo-binstall
      - uses: ./.github/actions/setup-just
      - run: just toolchain-ceiling
      - run: just shfmt-check
      - run: just shellcheck
      - run: just actionlint
      - run: just actionlint-composites
      - run: just zizmor
        env:
          GH_TOKEN: ${{ github.token }}
      - run: just ci-observability
      - run: just json-schemas
      - run: just links
      - run: just hook-scrub-selftest
      - run: just star-history-selftest
      - run: just bmc-button-selftest
      # The capture-tree provenance rules are NOT here: they are Rust tests
      # (`tests/sources/captures.rs`, #929) riding ci-tests.yml's three-platform
      # `test` job instead of this job's one, and no toolchain in a lint job.
      - run: just fixture-pii
      - run: just fixture-pii-selftest

  npm-gen:
    name: npm package generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Exercise the generator before release.yml uses it to publish.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-just
      - run: just npm-check

  # Generated-file freshness is formatter-class, so every PR push runs it
  # (docs.mergify.com/merge-queue/two-step: the preliminary step runs
  # "linters, formatters, unit tests, basic compile checks").
  generated:
    name: generated drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-just
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Set up Python virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Generated-file drift
        run: just gen-check
      # gen-icons-check's overlays.
      - name: Upload drift overlays
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: generated-drift-diffs
          path: target/gen-check-diff/
          retention-days: 7
          if-no-files-found: ignore

  # cargo-public-api complements release-plz's semver check: that one classifies
  # compatibility on the release PR, this golden shows the exact public surface
  # change at review time.
  api-surface:
    name: api-surface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-binstall
      - uses: ./.github/actions/setup-just
      - name: Install cargo-public-api (pinned to match the committed goldens)
        run: cargo binstall -y "cargo-public-api@$(just --evaluate API_PUBLIC_API)"
      - run: just api-surface-check

  # rustdoc warnings and doctests are invisible to clippy and nextest.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
      - run: just doc-check
