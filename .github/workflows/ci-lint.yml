name: ci-lint

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: rustfmt
          enable-cache: 'false'
      - run: just fmt-check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: clippy
      - run: just clippy

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      # No setup-cargo-just: nothing compiles here, so the runner's preinstalled
      # cargo is enough — but cargo-deny DOES shell out to `cargo metadata`.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny
      - uses: ./.github/actions/setup-just
      - run: just deny
      # Both verdicts show: a red deny must not hide arch.
      - if: ${{ !cancelled() }}
        run: just arch
      - uses: ./.github/actions/path-changed
        id: lockfile
        with:
          # deny.toml decides the verdict as much as the graph does.
          paths: Cargo.lock deny.toml
      - if: steps.lockfile.outputs.changed == 'true'
        run: just deny-advisories

  machete:
    name: unused deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # cargo-machete parses manifests and does not need a Rust toolchain.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-machete
      - uses: ./.github/actions/setup-just
      - run: just machete

  # The `just lint` recipes no other job runs, so a skipped local preflight can't land their break.
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Keyed on this workflow file: a version bump edits it, so the cache can
      # never serve a stale binary; any other ci-lint edit costs one cold
      # reinstall. ~/go/bin is spelled, not derived: GOPATH is the runner
      # default, and deriving it here while the cache stores a literal is how
      # a hit could restore binaries to a directory that is not on PATH.
      - name: Cache the Go-built tools
        id: go-tools
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('.github/workflows/ci-lint.yml') }}
      - name: Expose Go tool binaries
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install workflow lint + policy tools
        if: steps.go-tools.outputs.cache-hit != 'true'
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/mikefarah/yq/v4@v4.53.3
      - name: Install the JSON Schema validator
        run: pipx install check-jsonschema==0.37.4
      # Lychee is not manifest-managed by install-action, so its documented
      # cargo-binstall fallback installs our pinned version.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: lychee@0.24.2,zizmor@1.30.0
          fallback: cargo-binstall
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: shellcheck@0.11.0
          fallback: none
      # `just fixture-pii` is a REQUIRED gate and cannot degrade — a missing
      # gitleaks must fail the job, not silently scan nothing. Not via
      # taiki-e/install-action: gitleaks is not in its TOOLS.md (checked).
      - name: Install gitleaks
        run: |
          set -euo pipefail
          ver=8.30.1
          url="https://github.com/gitleaks/gitleaks/releases/download/v$ver/gitleaks_${ver}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - uses: ./.github/actions/setup-just
      - run: just shfmt-check
      - run: just shellcheck
      - run: just actionlint
      - run: just actionlint-composites
      - run: just zizmor
        env:
          GH_TOKEN: ${{ github.token }}
      - run: just ci-observability
      - run: just json-schemas
      - run: just links
      - run: just tuidrive-selftest
      - run: just e2e-scrub-selftest
      - run: just star-history-selftest
      - run: just bmc-button-selftest
      # The capture-tree provenance rules are NOT here: they are Rust tests
      # (`tests/sources/captures.rs`, #929) riding ci-tests.yml's three-platform
      # `test` job instead of this job's one, and no toolchain in a lint job.
      - run: just fixture-pii
      - run: just fixture-pii-selftest

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      # No rust-cache on purpose: it would key the runner's stable compiler,
      # while the MSRV recipe installs the exact rust-version toolchain.
      - uses: ./.github/actions/setup-just
      - run: just msrv

  npm-gen:
    name: npm package generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Exercise the generator before release.yml uses it to publish.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-just
      - run: just npm-check

  # Generated-file freshness is formatter-class, so every PR push runs it
  # (docs.mergify.com/merge-queue/two-step: the preliminary step runs
  # "linters, formatters, unit tests, basic compile checks").
  generated:
    name: generated drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-just
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Set up Python virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Generated sprites, icons and banner, README sections, the comparator
        run: just gen-readme-check gen-art-check gen-banner-check gen-icons-check compare-selftest
      # gen-icons-check's overlays.
      - name: Upload drift overlays
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-drift-diffs
          path: target/gen-check-diff/
          retention-days: 7
          if-no-files-found: ignore

  # cargo-public-api complements release-plz's semver check: that one classifies
  # compatibility on the release PR, this golden shows the exact public surface
  # change at review time.
  api-surface:
    name: api-surface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-binstall
      # The justfile's API_PUBLIC_API is the authority; api-surface-check
      # asserts this copy against it before reading a golden.
      - name: Install cargo-public-api (pinned to match the committed goldens)
        run: cargo binstall -y cargo-public-api@0.52.0
      - uses: ./.github/actions/setup-just
      - run: just api-surface-check

  # rustdoc warnings and doctests are invisible to clippy and nextest.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
      - run: just doc-check

  required:
    name: required-lint-jobs
    # This explicit manifest prevents a nested job deletion or rename from
    # silently shrinking the single protected ci-gate.
    if: ${{ always() }}
    needs: [fmt, clippy, deny, machete, hygiene, msrv, npm-gen, generated, api-surface, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: pixtuoid/.github/.github/actions/require-jobs@main
        with:
          results: ${{ toJSON(needs) }}
          label: "Required lint job failed"
