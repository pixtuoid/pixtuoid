name: ci-lint

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: rustfmt
          enable-cache: 'false'
      - run: just fmt-check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: clippy
      - run: just clippy

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # No setup-cargo-just: nothing compiles here, so the runner's preinstalled
      # cargo is enough — but cargo-deny DOES shell out to `cargo metadata`.
      - uses: ./.github/actions/setup-tools
        with:
          tools: cargo-deny
      - run: just deny
      # Both verdicts show: a red deny must not hide arch.
      - if: ${{ !cancelled() }}
        run: just arch
      - uses: ./.github/actions/path-changed
        id: lockfile
        with:
          # deny.toml decides the verdict as much as the graph does.
          paths: Cargo.lock deny.toml
      - if: steps.lockfile.outputs.changed == 'true'
        run: just deny-advisories

  machete:
    name: unused deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-machete parses manifests and does not need a Rust toolchain.
      - uses: ./.github/actions/setup-tools
        with:
          tools: github:bnjbvr/cargo-machete
      - run: just machete

  # The `just lint` recipes no other job runs, so a skipped local preflight can't land their break.
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          tools: shfmt aqua:rhysd/actionlint shellcheck zizmor yq jq gitleaks lychee pypi:check-jsonschema uv ruff
      # pyright and tsc.
      - uses: ./.github/actions/setup-npm
        with:
          directory: .
      - run: just toolchain-ceiling
      - run: just shfmt-check
      - run: just shellcheck
      - run: just actionlint
      - run: just actionlint-composites
      - run: just zizmor
        env:
          GH_TOKEN: ${{ github.token }}
      - run: just ci-observability
      - run: just json-schemas
      - run: just links
      - run: just ruff
      - run: just pyright
      - run: just tsc
      - run: just lang-census
      # The host install is the cost, so a PR that leaves every input of the
      # verdict alone skips it; path-changed treats a push as unchanged. Each
      # host's pin sits in its source module, which a bump PR moves.
      - uses: ./.github/actions/path-changed
        id: plugin-types
        with:
          paths: crates/pixtuoid/src/install crates/pixtuoid-core/src/source crates/pixtuoid-core/src/harness/hermetic/profiles crates/pixtuoid-core/examples/bump.rs package.json package-lock.json justfile .github/workflows/ci-lint.yml .github/actions/setup-npm site/package.json
      - if: steps.plugin-types.outputs.changed == 'true'
        uses: ./.github/actions/setup-npm
        with:
          directory: crates/pixtuoid/src/install
      # `bump plugin-types` names each host at its pin. No cache: main, the one
      # place a cache saves, never runs this.
      - if: steps.plugin-types.outputs.changed == 'true'
        uses: ./.github/actions/setup-cargo-just
        with:
          enable-cache: 'false'
      - if: steps.plugin-types.outputs.changed == 'true'
        run: just plugin-types
      - run: just hook-scrub-selftest
      - run: just star-history-selftest
      - run: just bmc-button-selftest
      - run: just hermes-plugin-selftest
      # The capture-tree provenance rules are NOT here: they are Rust tests
      # (`tests/sources/captures.rs`, #929) riding ci-tests.yml's three-platform
      # `test` job instead of this job's one, and no toolchain in a lint job.
      - run: just fixture-pii
      - run: just fixture-pii-selftest

  npm-gen:
    name: npm package generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exercise the generator before release.yml uses it to publish.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
      - uses: ./.github/actions/setup-tools
      - run: just npm-check

  # Generated-file freshness is formatter-class, so every PR push runs it
  # (docs.mergify.com/merge-queue/two-step: the preliminary step runs
  # "linters, formatters, unit tests, basic compile checks").
  generated:
    name: generated drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
      - uses: ./.github/actions/setup-tools
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Set up Python virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Generated-file drift
        run: just gen-check
      # gen-icons-check's overlays.
      - name: Upload drift overlays
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-drift-diffs
          path: target/gen-check-diff/
          retention-days: 7
          if-no-files-found: ignore

  # cargo-public-api complements release-plz's semver check: that one classifies
  # compatibility on the release PR, this golden shows the exact public surface
  # change at review time.
  api-surface:
    name: api-surface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-tools
        with:
          tools: cargo-binstall
      - name: Install cargo-public-api (pinned to match the committed goldens)
        run: just _install-public-api
      - run: just api-surface-check

  # rustdoc warnings and doctests are invisible to clippy and nextest.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
      - run: just doc-check
