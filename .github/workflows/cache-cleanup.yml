name: cache cleanup

# Two prunes under one grant shape: closed-PR caches (run in the base
# context, so fork PRs clean up too) and superseded main-ref rust
# generations. Never checkout or execute pull-request content here.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout or PR-code execution; policy pins the cache-only job
    types: [closed]
  # Each new rust cache generation strands its predecessor on the main ref;
  # deleting it deterministically beats the LRU lottery at the cache quota.
  # Every push, not a path filter, which would copy the files rust-cache
  # hashes into a generation (its src/config.ts).
  push:
    branches: [main]

# Per-job grants: with more than one job, a workflow-level write is
# zizmor's excessive-permissions class.
permissions: {}

concurrency:
  group: cache-cleanup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  closed-pr:
    name: closed PR
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
    steps:
      - name: Delete closed PR caches
        run: |
          gh cache delete --all --ref "$PR_REF" --succeed-on-no-caches
          echo "Cache cleanup completed for \`$PR_REF\` (no caches is a successful no-op)." >> "$GITHUB_STEP_SUMMARY"

  stale-generations:
    name: stale rust generations
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete superseded main-ref rust caches
        shell: bash
        run: |
          set -euo pipefail
          # Stripping the last segment reproduces rust-cache's own restoreKey
          # boundary (key = prefix-{shared key or job}-OS-arch-envhash-genhash),
          # so only generations compete inside a family; a toolchain bump
          # changes envhash, so it forks a new family and leaves the old one to
          # expire. A key with a non-hex tail becomes its own one-element
          # family and is never deleted — the failure direction is
          # under-prune, never over-prune. Keep each family's newest entry.
          # After a revert, or main builds saving out of order, that is not the
          # live generation: the live one is deleted, and the next build
          # restores the kept one and rebuilds what differs.
          # An assignment propagates a pipeline failure under pipefail (a
          # process substitution would swallow it); --limit 300 is an order
          # of magnitude past what the cache quota can hold
          # (docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching).
          ids=$(
            gh cache list --ref refs/heads/main --key v1-rust- --limit 300 --json id,key,createdAt \
              | jq -r 'group_by(.key | sub("-[0-9a-f]+$"; ""))
                  | map(sort_by(.createdAt) | .[:-1][])
                  | .[].id'
          )
          pruned=0
          for id in $ids; do
            # LRU can evict between list and delete — a benign race.
            gh cache delete "$id" || echo "::warning::cache $id already gone"
            pruned=$((pruned + 1))
          done
          echo "Pruned $pruned stale rust cache generation(s) on refs/heads/main." >> "$GITHUB_STEP_SUMMARY"
