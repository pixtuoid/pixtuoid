name: hermetic-nightly

# The drift watch: each profiled CLI's latest release against the scripted
# model, where a CLI that renamed or reshaped what pixtuoid reads turns a
# verdict red before a user upgrades into it.

on:
  schedule:
    - cron: "23 7 * * *" # daily 07:23 UTC
  workflow_dispatch:
permissions: {}
# Only `build` saves (`hermetic-caches-restore-only-but-their-one-writer`).
cache-mode: read

jobs:
  build:
    name: hermetic build (${{ matrix.runner }})
    # One leg per run leg (`hermetic-build-covers-every-run-os`).
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    # It only warms a cache, and setup-cargo-just saves from main alone.
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 45
    cache-mode: write
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          shared-key: hermetic
      - run: just hermetic-build

  drift:
    permissions:
      contents: read
    uses: ./.github/workflows/hermetic.yml
    with:
      full: true
      cli: latest

  # A release that moved on every leg becomes a bot PR. The legs ran the CLIs,
  # so what they report and record is untrusted; `bump` holds it to a bump.
  plan:
    name: plan the pin bumps
    needs: drift
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proposals: ${{ steps.plan.outputs.proposals }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          shared-key: hermetic
      - run: cargo build --release -q -p pixtuoid-core --example bump
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ toJSON(needs.drift.outputs) }}
        run: |
          gh pr list --state all --limit 200 --search 'in:title "chore(hermetic): pin"' \
            --json title > "$RUNNER_TEMP/taken.json"
          printf '%s' "$DRIFT" > "$RUNNER_TEMP/drift.json"
          proposals=$(target/release/examples/bump plan "$RUNNER_TEMP/taken.json" "$RUNNER_TEMP/drift.json")
          echo "proposals=$proposals" >> "$GITHUB_OUTPUT"

  bump:
    name: bump ${{ matrix.source }}
    needs: plan
    # A bare `if` is `success()`, which a failed drift leg upstream fails; one
    # CLI's drift must not hold back another's bump.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.proposals != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.proposals) }}
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          shared-key: hermetic
      - uses: ./.github/actions/setup-npm
        with:
          directory: crates/pixtuoid-core/tests/sources/hermetic/aimock
      # The release every drift leg passed, not a `latest` published since.
      - env:
          SOURCE: ${{ matrix.source }}
          RELEASE: ${{ matrix.version }}
        run: just hermetic-bump "$SOURCE" "$RELEASE" "$RUNNER_TEMP/$SOURCE.patch"
      - uses: actions/upload-artifact@v7
        with:
          name: patch-${{ matrix.source }}
          path: ${{ runner.temp }}/${{ matrix.source }}.patch
          retention-days: 1
          if-no-files-found: ignore

  check:
    name: check the bump patches
    needs: [plan, bump]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.proposals != '[]' }}
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      approved: ${{ steps.check.outputs.approved }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          shared-key: hermetic
      # Built before any patch is on the runner, outside the workspace.
      - run: cargo build --release -q -p pixtuoid-core --example bump
      - uses: actions/download-artifact@v8
        with:
          pattern: patch-*
          path: ${{ runner.temp }}/patches
          merge-multiple: true
      - id: check
        env:
          PROPOSALS: ${{ needs.plan.outputs.proposals }}
        run: |
          printf '%s' "$PROPOSALS" > "$RUNNER_TEMP/proposals.json"
          approved=$(target/release/examples/bump check "$RUNNER_TEMP/proposals.json" "$RUNNER_TEMP/patches")
          echo "approved=$approved" >> "$GITHUB_OUTPUT"

  # Holds the bot's write token, so it runs nothing from the tree
  # (`bot-publish-runs-no-tree-code`).
  publish:
    name: open the bump PR for ${{ matrix.source }}
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' && github.ref == 'refs/heads/main' && needs.check.outputs.approved != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.approved) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: patch-${{ matrix.source }}
          path: ${{ runner.temp }}
      - env:
          SOURCE: ${{ matrix.source }}
        run: git apply "$RUNNER_TEMP/$SOURCE.patch"
      # An App token, because a GITHUB_TOKEN PR starts no CI.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ matrix.branch }}
          delete-branch: true
          add-paths: ${{ join(matrix.paths, ',') }}
          sign-commits: true
          commit-message: ${{ matrix.title }}
          title: ${{ matrix.title }}
          body: "${{ matrix.source }}'s latest release passed every hermetic scenario on every OS, re-recorded here (`hermetic-nightly.yml`). A session reads the whole diff, fixtures included, then queues it."

  file:
    name: file the hermetic report
    needs: drift
    # A dispatch on a branch is a pre-merge proof, not the watch.
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.drift.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Each failed leg's runs, in a directory named after its artifact.
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.drift.outputs.runs-stem }}*

      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create hermetic --color FBCA04 \
            --description "A hermetic run's verdict on an agent CLI's latest release" 2>/dev/null || true
          # The orchestrator owns the title, as each failed leg's report H1
          # naming its OS, and they carry the disposition: retitle on the dedup
          # path too. A leg whose runs hold no report.md could not run: red,
          # once the others are filed.
          reports=(*/report.md)
          title=$(for r in "${reports[@]}"; do head -1 "$r" | sed 's/^# //'; done | awk 'NR > 1 { printf "; " } { printf "%s", $0 }')
          num=$(gh issue list --label hermetic --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue edit "$num" --title "$title"
            filed=0
          else
            url=$(gh issue create --title "$title" --label hermetic --body-file "${reports[0]}")
            num=${url##*/}
            filed=1
          fi
          for r in "${reports[@]:filed}"; do
            gh issue comment "$num" --body-file "$r"
          done
          for d in */; do
            [ -f "${d}report.md" ] || { echo "::error::${d%/} holds no report.md"; exit 1; }
          done
