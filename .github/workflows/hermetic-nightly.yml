name: hermetic-nightly

# Each profiled CLI's latest release against the scripted model, where a CLI
# that renamed or reshaped what pixtuoid reads in a recorded scenario turns a
# verdict red before a user upgrades into it, and one that added a type its
# decoders drop is filed as New.

on:
  schedule:
    - cron: "23 7 * * *" # daily 07:23 UTC
  workflow_dispatch:
permissions: {}
# Only `build` saves (`hermetic-caches-restore-only-but-their-one-writer`).
cache-mode: read

jobs:
  build:
    name: hermetic build (${{ matrix.runner }})
    # One leg per run leg (`hermetic-build-covers-every-run-os`).
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    # It only warms a cache, and setup-cargo-just saves from main alone.
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 45
    cache-mode: write
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          shared-key: hermetic
      - run: just hermetic-build

  drift:
    permissions:
      contents: read
    uses: ./.github/workflows/hermetic.yml
    with:
      full: true
      cli: latest

  # A release that moved on every leg becomes a bot PR. The legs ran the CLIs,
  # so what they report and record is untrusted; `bump` holds it to a bump.
  plan:
    name: plan the pin bumps
    needs: drift
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proposals: ${{ steps.plan.outputs.proposals }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          shared-key: hermetic
      - run: cargo build --release -q -p pixtuoid-core --example bump
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ toJSON(needs.drift.outputs) }}
        run: |
          gh pr list --state all --limit 200 --search 'in:title "chore(hermetic): pin"' \
            --json title > "$RUNNER_TEMP/taken.json"
          printf '%s' "$DRIFT" > "$RUNNER_TEMP/drift.json"
          proposals=$(target/release/examples/bump plan "$RUNNER_TEMP/taken.json" "$RUNNER_TEMP/drift.json")
          echo "proposals=$proposals" >> "$GITHUB_OUTPUT"

  bump:
    name: bump ${{ matrix.source }}
    needs: plan
    # A bare `if` is `success()`, which a failed drift leg upstream fails; one
    # CLI's drift must not hold back another's bump.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.proposals != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.proposals) }}
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          shared-key: hermetic
          # `Package::UvLocked` profiles (hermes) sync their tag's lock with uv.
          tools: uv
      - uses: ./.github/actions/setup-npm
        with:
          directory: crates/pixtuoid-core/tests/sources/hermetic/aimock
      # The release every drift leg passed, not a `latest` published since.
      - env:
          SOURCE: ${{ matrix.source }}
          RELEASE: ${{ matrix.version }}
        run: just hermetic-bump "$SOURCE" "$RELEASE" "$RUNNER_TEMP/$SOURCE.patch"
      - uses: actions/upload-artifact@v7
        with:
          name: patch-${{ matrix.source }}
          path: ${{ runner.temp }}/${{ matrix.source }}.patch
          retention-days: 1
          if-no-files-found: ignore

  check:
    name: check the bump patches
    needs: [plan, bump]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.proposals != '[]' }}
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      approved: ${{ steps.check.outputs.approved }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          shared-key: hermetic
      # Built before any patch is on the runner, outside the workspace.
      - run: cargo build --release -q -p pixtuoid-core --example bump
      - uses: actions/download-artifact@v8
        with:
          pattern: patch-*
          path: ${{ runner.temp }}/patches
          merge-multiple: true
      - id: check
        env:
          PROPOSALS: ${{ needs.plan.outputs.proposals }}
        run: |
          printf '%s' "$PROPOSALS" > "$RUNNER_TEMP/proposals.json"
          approved=$(target/release/examples/bump check "$RUNNER_TEMP/proposals.json" "$RUNNER_TEMP/patches")
          echo "approved=$approved" >> "$GITHUB_OUTPUT"

  # Holds the bot's write token, so it runs nothing from the tree
  # (`bot-publish-runs-no-tree-code`).
  publish:
    name: open the bump PR for ${{ matrix.source }}
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' && github.ref == 'refs/heads/main' && needs.check.outputs.approved != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.approved) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: patch-${{ matrix.source }}
          path: ${{ runner.temp }}
      - env:
          SOURCE: ${{ matrix.source }}
        run: git apply "$RUNNER_TEMP/$SOURCE.patch"
      # An App token, because a GITHUB_TOKEN PR starts no CI.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ matrix.branch }}
          delete-branch: true
          add-paths: ${{ join(matrix.paths, ',') }}
          sign-commits: true
          commit-message: ${{ matrix.title }}
          title: ${{ matrix.title }}
          body: "${{ matrix.source }}'s latest release passed every hermetic scenario each OS runs, re-recorded here (`hermetic-nightly.yml`). A session reads the whole diff, fixtures included, then queues it."

  file:
    name: file the hermetic issues
    needs: drift
    # A dispatch on a branch is a pre-merge proof, not the nightly's verdict.
    # A passing run with a New finding uploads its report too, so this files
    # whatever the legs uploaded, failed or not.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.drift.outputs.runs-stem }}*

      - name: File an issue per failing run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRIFT: ${{ toJSON(needs.drift.outputs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # One uploaded leg lands flat, several each in their artifact's
          # directory (download-artifact v8.0.2 `src/download-artifact.ts:188-193`).
          if [ -f verdicts.json ]; then
            legs=(verdicts.json)
          else
            legs=(*/verdicts.json)
          fi
          if [ ${#legs[@]} -gt 0 ]; then
            verdicts=$(jq -s . "${legs[@]}")
          else
            verdicts='[]'
          fi
          open=$(gh issue list --label hermetic --state open --limit 500 --json number,title)
          # One issue per run that did not pass, titled by its key, and one per
          # leg that never finished: a leg sets its `moved_<os>_<shard>` only
          # once its run finished, so an empty one timed out, was cancelled or
          # crashed, uploaded or not. An issue no leg files tonight closes, a
          # run's only once every leg finished, since a lost leg's runs are unknown.
          plan=$(jq -c --argjson drift "$DRIFT" --argjson open "$open" --arg run "$RUN_URL" '
            def leg: "\(.os), shard \(.shard)";
            def rank: . as $label | ["Pass", "New", "Stale", "Blocked", "Script", "Fail"] | index($label);
            def link($artifact): if $artifact == "" then "" else "\nIts runs: \($artifact)\n" end;
            def issue_of($title): [$open[] | select(.title == $title) | .number] | first;
            [$drift | to_entries[] | select(.key | startswith("moved_"))
              | (.key | capture("^moved_(?<os>.+)_(?<shard>[0-9]+)$"))
              | . + {done: ($drift["moved_\(.os)_\(.shard)"] != ""), artifact: ($drift["artifact_\(.os)_\(.shard)"] // "")}] as $legs
            | [$legs[] | select(.done | not)] as $lost
            | [.[] | leg as $leg | ($drift["artifact_\(.os)_\(.shard)"] // "") as $artifact
                | .runs[] | select(.label != "Pass") | . + {leg: $leg, artifact: $artifact}]
            | group_by(.key)
            | [(.[] | {
                  title: "hermetic: \(.[0].key)",
                  body: ("**\(max_by(.label | rank) | .label)** in \($run), on \([.[].leg] | unique | join("; ")).\n"
                    + ([.[] | "\n### \(.leg)\(if .version then " (\(.version))" else "" end): \(.label)\n"
                        + ([.findings[] | "- \(.)\n"] | join("")) + link(.artifact)] | join("")))
                }),
               ($lost[] | {
                  title: "hermetic: \(leg) never finished its run",
                  body: ("**Unfinished** in \($run): no verdict names what it ran.\n" + link(.artifact))
                })] as $filed
            | {
                lost: [$lost[] | leg],
                actions: (
                  [$filed[] | issue_of(.title) as $n
                    | if $n then {do: "comment", number: $n, body} else {do: "create", title, body} end]
                  + [$open[] | select(.title | startswith("hermetic: "))
                      | select(.title as $t | [$filed[].title] | index($t) | not)
                      | (.title | ltrimstr("hermetic: ")) as $key
                      | ([$key | capture("^(?<os>[^,]+), shard (?<shard>[0-9]+) never finished its run$")] | first) as $unfinished
                      | if $unfinished then
                          select(any($legs[]; .done and leg == ($unfinished | leg)))
                          | {do: "close", number, body: "\($unfinished | leg) finished its run in \($run)."}
                        elif ($lost | length) == 0 then
                          {do: "close", number, body: "No leg reported \($key) failing in \($run)."}
                        else empty end])
              }' <<<"$verdicts")
          while IFS= read -r action; do
            jq -r '.body' <<<"$action" >"$RUNNER_TEMP/issue.md"
            case $(jq -r '.do' <<<"$action") in
              create) gh issue create --title "$(jq -r '.title' <<<"$action")" --label hermetic --body-file "$RUNNER_TEMP/issue.md" ;;
              comment) gh issue comment "$(jq -r '.number' <<<"$action")" --body-file "$RUNNER_TEMP/issue.md" ;;
              close) gh issue close "$(jq -r '.number' <<<"$action")" --comment "$(<"$RUNNER_TEMP/issue.md")" ;;
            esac
          done < <(jq -c '.actions[]' <<<"$plan")
          # Red once the rest are filed.
          lost=$(jq -r '.lost[]' <<<"$plan")
          [ -z "$lost" ] || { awk '{ print "::error::" $0 " never finished its run" }' <<<"$lost"; exit 1; }
