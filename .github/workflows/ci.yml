name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Not ready_for_review: a PR runs the light tier draft or not, so marking it
    # ready would re-judge an unchanged head at the same tier.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  # Every main push gets its own group: in a shared one a newer push replaces
  # the pending run, so that SHA never gets the ci-gate a release waits on.
  # `queue: max` cannot do it here: it rejects `cancel-in-progress: true`,
  # which PR runs need, and takes no expression.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  # NEVER cancel an in-flight main run — back-to-back merges would abort each
  # other's CI verdict + Codecov upload.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Two-step CI (docs.mergify.com/merge-queue/two-step): a PR's pushes run the
  # light tier and pass ci-gate on it; the full tier runs on main, and on the
  # merge queue's draft PR, which Mergify skips for an up-to-date PR alone at
  # the front of the queue.
  tier:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      full: ${{ steps.tier.outputs.full }}
    steps:
      - id: tier
        env:
          # The queue's branches live in this repo; a fork's same-named branch
          # must not buy itself the full tier's runners.
          FULL: ${{ github.event_name != 'pull_request' || (startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: echo "full=$FULL" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint & Hygiene
    uses: ./.github/workflows/ci-lint.yml

  builds:
    name: Builds & Packaging
    needs: tier
    uses: ./.github/workflows/ci-builds.yml
    with:
      full: ${{ needs.tier.outputs.full == 'true' }}

  tests:
    name: Test Suite & Coverage
    needs: tier
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-tests.yml
    with:
      full: ${{ needs.tier.outputs.full == 'true' }}
    secrets:
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}

  site:
    name: Site
    needs: tier
    uses: ./.github/workflows/site.yml
    with:
      full: ${{ needs.tier.outputs.full == 'true' }}

  raycast:
    name: Raycast
    uses: ./.github/workflows/raycast.yml

  hermetic:
    name: Hermetic
    needs: tier
    uses: ./.github/workflows/hermetic.yml
    with:
      full: ${{ needs.tier.outputs.full == 'true' }}

  gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [lint, builds, tests, site, raycast, hermetic]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # toJSON(needs) carries every group this job needs, so a group added to
      # `needs` is judged without also being named in a verdict script.
      - uses: pixtuoid/.github/.github/actions/require-jobs@main
        with:
          results: ${{ toJSON(needs) }}
          label: "CI group failed"
