name: security audit

# A dependency set that did not change still meets new advisories: this
# judges each one daily, and a PR judges only the lockfiles it changes.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The same cargo-deny ci-lint installs, so one version judges deny.toml.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny
      - uses: ./.github/actions/setup-just
      - run: just deny-advisories

  npm:
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [site, integrations/raycast]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # `npm audit` reads the lockfile; nothing is installed or run.
      - run: npm run audit
        working-directory: ${{ matrix.dir }}
