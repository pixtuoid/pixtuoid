name: release

on:
  push:
    tags: ["v*"]

# Lossless repo-wide release queue: different tags must not interleave irreversible
# crates.io/npm publication, and a publish must never be interrupted.
concurrency:
  group: pixtuoid-release
  queue: max
  cancel-in-progress: false

# Least-privilege (#215): jobs inherit read-only and widen scope per job, so a
# compromised action anywhere else gets no repo-write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history for the tag-on-main ancestry check below.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-gpu
      - uses: pixtuoid/.github/.github/actions/setup-rust@main
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/setup-just
      - name: Validate tag commit is on main
        # A release tag pushed at an arbitrary (unreviewed) commit must not build +
        # publish (#215). Pre-release tester tags are exempt — they test pre-merge.
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main — release tags must be cut from main"
            exit 1
          fi
      - name: Validate tag matches Cargo.toml version
        run: |
          # A pre-release suffix is release-channel metadata, not a Cargo version,
          # so it validates against the base version.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          CARGO_VERSION=$(just workspace-version)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
      # Intentionally lighter than `just preflight full` (no lint + hack): the tag comes
      # from main, which already passed the full CI matrix — this re-verifies
      # fmt/clippy/tests against the exact tagged commit.
      - run: just fmt-check
      - run: just clippy
      - run: just test

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # aarch64 cross-links on the same x64 runner (VC ARM64 components preinstalled).
          # `windows-latest` is validated only at TAG time (release.yml doesn't run on
          # PRs) — re-pin to a dated label if a runner-image bump regresses it.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pixtuoid/.github/.github/actions/setup-rust@main
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-just

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cross

      - if: contains(matrix.target, 'musl')
        uses: ./.github/actions/apt-install
        with:
          packages: musl-tools

      - name: Build
        run: just build-target ${{ matrix.target }} "${{ matrix.cross || 'false' }}"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DIR="pixtuoid-${VERSION}-${{ matrix.target }}"
          mkdir "$DIR"
          cp "target/${{ matrix.target }}/release/pixtuoid" "$DIR/"
          cp "target/${{ matrix.target }}/release/pixtuoid-hook" "$DIR/"
          just stage-notices "$DIR"
          tar czf "${DIR}.tar.gz" "$DIR"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Flat zip — exes at zip root so Expand-Archive doesn't double-wrap.
          VERSION="${GITHUB_REF_NAME}"
          DIR="pixtuoid-${VERSION}-${{ matrix.target }}"
          mkdir "$DIR"
          cp "target/${{ matrix.target }}/release/pixtuoid.exe" "$DIR/"
          cp "target/${{ matrix.target }}/release/pixtuoid-hook.exe" "$DIR/"
          just stage-notices "$DIR"
          ( cd "$DIR" && 7z a "../${DIR}.zip" . )

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  deb:
    name: deb (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pixtuoid/.github/.github/actions/setup-rust@main
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-just

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cross

      - name: Install cargo-deb
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deb

      - name: Build
        run: just build-target ${{ matrix.target }} "${{ matrix.cross || 'false' }}"

      - name: Build .deb packages
        run: just deb ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.target }}
          path: target/${{ matrix.target }}/debian/*.deb
          if-no-files-found: error

  release:
    name: release
    needs: [build, deb]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # fills the draft release release-plz created
      id-token: write # provenance attestation (OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum -- *.tar.gz *.deb *.zip > sha256sums.txt

      # Before the release goes public, so a failed attestation leaves a draft,
      # never a published release without provenance.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.zip

      # release-plz created this release as a DRAFT carrying the changelog, so
      # the version is never visible without its binaries. Passing neither
      # `body` nor `prerelease` keeps what release-plz wrote (the action retains
      # the existing release's info for every key it isn't given), and omitting
      # `draft` is what publishes it once the assets are attached.
      - name: Fill and publish the draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 # zizmor: ignore[superfluous-actions] mature release action avoids hand-rolled gh release behavior
        with:
          # Passed rather than inherited because the hand-tag recovery path
          # (release-plz.yml's own error message) leaves NO draft to inherit
          # from, and the action then creates the release with this field unset
          # — an `-rc.N` tag would land as the latest stable release. On the
          # normal path it restates what `git_release_type = "auto"` chose.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.zip
            artifacts/sha256sums.txt

  npm:
    name: publish to npm
    # The full build matrix gates this one: an npm publish is irreversible (no
    # unpublish after 72h) and its packages ARE those binaries, so a target that
    # fails to build must not reach the registry as a missing optional dep.
    needs: [check, build, deb]
    # Never publish a pre-release to npm — tester tags build artifacts only.
    if: ${{ !contains(github.ref_name, '-') }}
    # Its required reviewer is the publish approval, and the npm Trusted
    # Publisher records name it, so no other job can publish.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance (`npm publish --provenance`)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7 # zizmor: ignore[cache-poisoning] this publisher does not enable setup-node's package cache
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm Trusted Publishing (#216): node 22 bundles npm 10.x but OIDC needs
      # >= 11.5.1, and OIDC is the only auth path (no NODE_AUTH_TOKEN) — without
      # this upgrade the publish silently fails unauthenticated. `registry-url`
      # above STAYS: it is what triggers npm's OIDC detection. Pinned EXACTLY, not
      # @11 — an irreversible publish must not float with the registry.
      - run: npm install -g npm@11.5.1 # zizmor: ignore[adhoc-packages] exact OIDC-capable npm bootstrap for trusted publishing
      - uses: ./.github/actions/setup-just

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract binaries per target
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Mirrors the `build` matrix + npm/generate.mjs TARGETS; that equality is
          # pinned by npm/generate.test.mjs (`just npm-check`).
          for target in aarch64-apple-darwin x86_64-apple-darwin \
                        x86_64-unknown-linux-musl aarch64-unknown-linux-gnu \
                        x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            dest="npm/dist/${target}"
            mkdir -p "$dest"
            tgz="artifacts/pixtuoid-${TAG}-${target}.tar.gz"
            zip="artifacts/pixtuoid-${TAG}-${target}.zip"
            if [ -f "$tgz" ]; then
              tar xzf "$tgz" -C "$dest" --strip-components=1
            elif [ -f "$zip" ]; then
              unzip -o "$zip" -d "$dest"
            else
              echo "::error::missing artifact for ${target} (${tgz} / ${zip})"
              exit 1
            fi
          done

      - name: Test the package generator
        run: just npm-check

      - name: Generate npm packages
        run: node npm/generate.mjs --version "${GITHUB_REF_NAME#v}" --artifacts npm/dist

      - name: Publish (platform packages first, launcher last)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Idempotent: swallow "cannot publish over previously published" so a
          # re-run of a partially-published tag is safe.
          publish_one() {
            local dir="$1" name out
            name=$(node -p "require('./${dir}/package.json').name")
            if out=$(npm publish "$dir" --access public --provenance 2>&1); then
              printf '%s\n' "$out"; echo "::notice::${name} published"; return 0
            elif grep -qiE 'cannot publish over|previously published' <<<"$out"; then
              # Match ONLY the over-publish phrase — never a bare 403, which npm
              # also emits for auth/scope/2FA failures we must NOT swallow.
              printf '%s\n' "$out"; echo "::warning::${name}@${VERSION} already on npm, skipping"; return 0
            else
              printf '%s\n' "$out"; echo "::error::${name} publish failed"; return 1
            fi
          }
          # Platform packages first so the launcher's optionalDependencies always
          # resolve to already-live versions. The `./` prefix is load-bearing:
          # `npm publish npm/pixtuoid` parses the path as a GitHub `owner/repo`
          # shorthand and tries to `git ls-remote` it.
          for dir in ./npm/@pixtuoid/cli-*; do publish_one "$dir"; done
          publish_one ./npm/pixtuoid
