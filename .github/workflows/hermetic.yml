name: hermetic

# `just hermetic`: every profiled agent CLI, run for real with a headless
# pixtuoid on the same run.

on:
  workflow_call:
    inputs:
      full:
        description: 'False on a PR outside the merge queue: only the jobs without `if: inputs.full` run'
        type: boolean
        required: true
      cli:
        description: '`pinned` (each registry `verified_version`) or `latest`'
        type: string
        default: pinned
    outputs:
      verdicts-stem:
        description: 'The stem every leg uploads its verdicts under, as `<verdicts-stem><os>-<shard>`, empty when its run wrote none; a re-run leg replaces its own'
        value: ${{ jobs.run.outputs.verdicts-stem }}
      moved_macos_1:
        description: 'The macOS shard 1 leg''s `bump::MOVED` rows: each source whose latest passed above its pin'
        value: ${{ jobs.run.outputs.moved_macos_1 }}
      moved_macos_2:
        description: 'The macOS shard 2 leg''s `bump::MOVED` rows'
        value: ${{ jobs.run.outputs.moved_macos_2 }}
      moved_windows_1:
        description: 'The Windows shard 1 leg''s `bump::MOVED` rows'
        value: ${{ jobs.run.outputs.moved_windows_1 }}
      moved_windows_2:
        description: 'The Windows shard 2 leg''s `bump::MOVED` rows'
        value: ${{ jobs.run.outputs.moved_windows_2 }}
      runs_url_macos_1:
        description: 'The URL of the runs the macOS shard 1 leg uploaded, empty when it uploaded none'
        value: ${{ jobs.run.outputs.runs_url_macos_1 }}
      runs_url_macos_2:
        description: 'The macOS shard 2 leg''s uploaded runs'' URL'
        value: ${{ jobs.run.outputs.runs_url_macos_2 }}
      runs_url_windows_1:
        description: 'The Windows shard 1 leg''s uploaded runs'' URL'
        value: ${{ jobs.run.outputs.runs_url_windows_1 }}
      runs_url_windows_2:
        description: 'The Windows shard 2 leg''s uploaded runs'' URL'
        value: ${{ jobs.run.outputs.runs_url_windows_2 }}

# `run` executes third-party CLIs, so no job here saves a cache
# (https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#controlling-cache-access-with-cache-mode).
cache-mode: read

jobs:
  run:
    name: hermetic (${{ inputs.cli }}, ${{ matrix.os }}, ${{ matrix.shard }})
    if: ${{ inputs.full }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos, windows]
        # `hermetic::SHARDS`; more legs would hold more of the macOS runners
        # (https://docs.github.com/en/actions/reference/limits).
        shard: [1, 2]
        include:
          # The recorded workspace's realpath (`/private/tmp`) and kqueue
          # liveness are macOS's, the platform the corpus was recorded on.
          - { os: macos, runner: macos-latest, timeout: 30 }
          - { os: windows, runner: windows-latest, timeout: 45 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        # Windows' default is pwsh.
        shell: bash
    # A matrix job's output is the last leg's to finish (docs.github.com
    # workflow-syntax, "Using job outputs in a matrix job"), so it comes from
    # job-level env, which `jobs.<id>.outputs` can read (docs.github.com
    # contexts, "Context availability") and no step has to reach.
    env:
      RUNS_STEM: hermetic-runs-${{ github.run_id }}-${{ github.run_attempt }}-
      VERDICTS_STEM: hermetic-verdicts-${{ github.run_id }}-
    outputs:
      verdicts-stem: ${{ env.VERDICTS_STEM }}
      # Each leg sets only its own, and a matrix combines its legs' outputs.
      moved_macos_1: ${{ steps.moved.outputs.moved_macos_1 }}
      moved_macos_2: ${{ steps.moved.outputs.moved_macos_2 }}
      moved_windows_1: ${{ steps.moved.outputs.moved_windows_1 }}
      moved_windows_2: ${{ steps.moved.outputs.moved_windows_2 }}
      runs_url_macos_1: ${{ steps.runs-url.outputs.runs_url_macos_1 }}
      runs_url_macos_2: ${{ steps.runs-url.outputs.runs_url_macos_2 }}
      runs_url_windows_1: ${{ steps.runs-url.outputs.runs_url_windows_1 }}
      runs_url_windows_2: ${{ steps.runs-url.outputs.runs_url_windows_2 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          shared-key: hermetic
          # `Package::UvLocked` profiles (hermes) sync their tag's lock with uv.
          tools: uv
      # Node, and the repo's one npm, whose allowScripts policy the tier's CLI
      # installs rely on.
      - uses: ./.github/actions/setup-npm
        with:
          directory: crates/pixtuoid-core/tests/sources/hermetic/aimock
      - name: Run the shard's profiles
        id: run
        env:
          CLI: ${{ inputs.cli }}
          SHARD: ${{ matrix.shard }}
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: 1
        run: |
          set +e
          just hermetic --cli "$CLI" --shard "$SHARD"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Report the moved releases
        id: moved
        env:
          OS: ${{ matrix.os }}
          SHARD: ${{ matrix.shard }}
        run: echo "moved_${OS}_${SHARD}=$(cat target/hermetic/runs/moved.json)" >> "$GITHUB_OUTPUT"
      # A run that passes with a New finding still uploads its runs, which the
      # nightly's issue links.
      - name: Report the new types
        id: new
        if: steps.run.outputs.exit == '0'
        run: |
          any=$(jq '.runs | any(.label == "New")' target/hermetic/runs/verdicts.json)
          echo "any=$any" >> "$GITHUB_OUTPUT"
      - if: always() && steps.run.outcome != 'skipped' && (steps.run.outcome != 'success' || steps.run.outputs.exit != '0' || steps.new.outputs.any == 'true')
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RUNS_STEM }}${{ matrix.os }}-${{ matrix.shard }}
          path: target/hermetic/runs
          retention-days: 7
          if-no-files-found: error
      # Every leg's, under a name each attempt replaces, empty when this one wrote
      # none: the nightly reads the latest (download-artifact v8.0.2 `src/download-artifact.ts:149-150`).
      - if: always()
        run: mkdir -p target/hermetic/runs && touch target/hermetic/runs/verdicts.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.VERDICTS_STEM }}${{ matrix.os }}-${{ matrix.shard }}
          path: target/hermetic/runs/verdicts.json
          retention-days: 1
          overwrite: true
      # The issues the nightly files link it (upload-artifact v7 `action.yml`'s
      # `artifact-url`, empty when the upload failed or never ran).
      - name: Report the uploaded runs
        id: runs-url
        if: always()
        env:
          OS: ${{ matrix.os }}
          SHARD: ${{ matrix.shard }}
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: echo "runs_url_${OS}_${SHARD}=${URL}" >> "$GITHUB_OUTPUT"
      - name: Fail on a failing verdict
        if: steps.run.outputs.exit != '0'
        env:
          CODE: ${{ steps.run.outputs.exit }}
        run: |
          echo "::error::just hermetic exited ${CODE}; its report.md heads the uploaded runs"
          exit 1

  required:
    name: required-hermetic-jobs
    if: ${{ always() }}
    needs: [run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: pixtuoid/.github/.github/actions/require-jobs@main
        with:
          results: ${{ toJSON(needs) }}
          label: "Hermetic run failed"
          allow-skipped: ${{ !inputs.full }}
