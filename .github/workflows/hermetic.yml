name: hermetic

# `just hermetic`: every profiled agent CLI, run for real against a scripted
# model with a headless pixtuoid on the same run.

on:
  workflow_call:
    inputs:
      full:
        description: 'False on a PR outside the merge queue: only the jobs without `if: inputs.full` run'
        type: boolean
        required: true
      cli:
        description: '`pinned` (each registry `verified_version`) or `latest`'
        type: string
        default: pinned
    outputs:
      runs-stem:
        description: 'The stem each OS leg uploads its runs under, as `<runs-stem><os>`, when `just hermetic` exits non-zero'
        value: ${{ jobs.run.outputs.runs-stem }}
      moved_macos:
        description: 'The macOS leg''s `bump::MOVED` rows: each source whose latest passed above its pin'
        value: ${{ jobs.run.outputs.moved_macos }}
      moved_windows:
        description: 'The Windows leg''s `bump::MOVED` rows'
        value: ${{ jobs.run.outputs.moved_windows }}

# `run` executes third-party CLIs, so no job here saves a cache
# (https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#controlling-cache-access-with-cache-mode).
cache-mode: read

jobs:
  run:
    name: hermetic (${{ inputs.cli }}, ${{ matrix.os }})
    if: ${{ inputs.full }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The recorded workspace's realpath (`/private/tmp`) and kqueue
          # liveness are macOS's, the platform the corpus was recorded on.
          - { os: macos, runner: macos-latest, timeout: 30 }
          - { os: windows, runner: windows-latest, timeout: 45 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        # Windows' default is pwsh.
        shell: bash
    # A matrix job's output is the last leg's to finish (docs.github.com
    # workflow-syntax, "Using job outputs in a matrix job"), so it comes from
    # job-level env, which `jobs.<id>.outputs` can read (docs.github.com
    # contexts, "Context availability") and no step has to reach.
    env:
      RUNS_STEM: hermetic-runs-${{ github.run_id }}-${{ github.run_attempt }}-
    outputs:
      runs-stem: ${{ env.RUNS_STEM }}
      # Each leg sets only its own, and a matrix combines its legs' outputs.
      moved_macos: ${{ steps.moved.outputs.moved_macos }}
      moved_windows: ${{ steps.moved.outputs.moved_windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          shared-key: hermetic
      # Node, and the repo's one npm, whose allowScripts policy the tier's CLI
      # installs rely on.
      - uses: ./.github/actions/setup-npm
        with:
          directory: crates/pixtuoid-core/tests/sources/hermetic/aimock
      - name: Run every profile
        id: run
        env:
          CLI: ${{ inputs.cli }}
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: 1
        run: |
          set +e
          just hermetic --cli "$CLI"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Report the moved releases
        id: moved
        env:
          OS: ${{ matrix.os }}
        run: echo "moved_${OS}=$(cat target/hermetic/runs/moved.json)" >> "$GITHUB_OUTPUT"
      - if: steps.run.outputs.exit != '0'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RUNS_STEM }}${{ matrix.os }}
          path: target/hermetic/runs
          retention-days: 7
          if-no-files-found: error
      - name: Fail on any verdict but Pass
        if: steps.run.outputs.exit != '0'
        env:
          CODE: ${{ steps.run.outputs.exit }}
        run: |
          echo "::error::just hermetic exited ${CODE}; its report.md heads the uploaded runs"
          exit 1

  required:
    name: required-hermetic-jobs
    if: ${{ always() }}
    needs: [run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: pixtuoid/.github/.github/actions/require-jobs@main
        with:
          results: ${{ toJSON(needs) }}
          label: "Hermetic run failed"
          allow-skipped: ${{ !inputs.full }}
