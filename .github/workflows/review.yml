name: claude-review
on:
  pull_request:
    # The queue squashes a PR into its title and body, so an edit to them, or
    # to the base, after the review's verdict is reviewed again: `edited` is
    # either (docs.github.com/en/webhooks/webhook-events-and-payloads).
    types: [opened, synchronize, ready_for_review, reopened, edited]
permissions: {}
jobs:
  claude-review:
    uses: pixtuoid/.github/.github/workflows/claude-review.yml@main
    permissions:
      contents: read
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
