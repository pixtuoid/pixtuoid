name: star-history

# Draws the README's star chart and force-pushes it as ONE orphan commit on the
# `star-history` branch (the branch never grows; main never sees a bot commit).
# Why self-hosted (the 2026-06-30 stargazers restriction): the docstring of
# scripts/star-history.py. `watch` refreshes on each new star —
# `cancel-in-progress` folds a burst into one run — the cron keeps the right
# edge current on quiet days, and the `push` arm republishes the moment the
# renderer, its art or this file changes on main (it is also the first run after merge).

on:
  schedule:
    - cron: "23 4 * * *" # daily 04:23 UTC
  watch:
    types: [started]
  push:
    branches: [main]
    paths:
      - scripts/star-history.py
      - scripts/readme_pixels.py
      - scripts/readme-palette.json
      - crates/pixtuoid-scene/sprites/default/pack.toml
      - crates/pixtuoid-scene/sprites/default/cat_sit_[0-9].sprite
      - .github/workflows/star-history.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  chart:
    name: render and publish
    # A fork would force-push a `star-history` branch into its own repo on every
    # cron. Gated by id, as release-plz.yml is.
    if: github.repository_id == '1245333424'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render the chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/star-history.py "$GITHUB_REPOSITORY" "$RUNNER_TEMP/chart"

      - id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Publish to the star-history branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_branch: star-history
          publish_dir: ${{ runner.temp }}/chart
          force_orphan: true
          # The branch holds the chart alone, as before; it is not a Pages site.
          disable_nojekyll: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "chart: star history as of ${{ steps.day.outputs.date }}"
