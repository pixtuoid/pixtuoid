name: ci-tests

on:
  workflow_call:
    inputs:
      full:
        description: 'False on a PR outside the merge queue: only the jobs without `if: inputs.full` run'
        type: boolean
        required: true
    secrets:
      MERGIFY_TOKEN:
        required: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Unit tests on every platform run on every PR push
  # (docs.mergify.com/merge-queue/two-step: the preliminary step runs
  # "linters, formatters, unit tests, basic compile checks").
  test:
    name: ${{ matrix.platform }}-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            flag: unit
            timeout: 25
            # The drift watch's parsers build only under `upstream`, and its
            # readers read fetched text alike on every OS: one platform pays.
            features: --features pixtuoid/upstream
          # Track windows-latest deliberately: this gate catches hosted-image
          # changes. It runs the Windows pipes and atomic-write retries the Linux
          # entry compiles out, and the full tier uploads their coverage.
          - platform: windows
            runner: windows-latest
            flag: windows
            timeout: 25
          # macos-latest is Apple Silicon, so it exercises that build; macOS diverges on BSD
          # CLI, launchd, and config paths, which the Linux entry compiles out.
          - platform: macos
            runner: macos-latest
            flag: macos
            timeout: 20
    runs-on: ${{ matrix.runner }}
    # nextest owns per-test hang limits.
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      id-token: write
    env:
      # A fork's PR gets no secrets; its results simply aren't uploaded.
      HAS_MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-gpu
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: llvm-tools-preview
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov
      # Both tiers run the instrumented suite: rust-cache keys a job's cache on
      # the job and toolchain, not the build, and a PR restores what main's full
      # tier saved, so a plain PR build recompiled the whole graph.
      - name: Unit tests under coverage + JUnit XML
        id: tests
        run: just coverage ${{ matrix.features }}
      - name: Upload coverage to Codecov
        if: ${{ inputs.full }}
        uses: pixtuoid/.github/.github/actions/upload-codecov@main
        with:
          file: codecov.json
          flag: ${{ matrix.flag }}
      - name: Upload test results to Mergify CI Insights
        if: ${{ !cancelled() && env.HAS_MERGIFY_TOKEN == 'true' }}
        uses: Mergifyio/gha-mergify-ci@ce0d6bef01217d90fb9e908e6966b0f6f4ea26d5 # v26
        with:
          action: junit-process
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: target/nextest/ci/junit.xml
          job_name: ${{ matrix.platform }}-test
          test_step_outcome: ${{ steps.tests.outcome }}

  smoke:
    name: smoke
    if: ${{ inputs.full }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
      - name: Build release binaries + examples
        run: just build --release --bins --examples
      - name: pixtuoid --help exits 0
        run: ./target/release/pixtuoid --help
      - name: pixtuoid-hook exits 0 with no socket
        # Release-profile coverage of invariant #5: always exit zero silently.
        run: |
          out=$(echo '{}' | ./target/release/pixtuoid-hook 2>&1)
          test -z "$out"
          echo "hook shim exited 0 silently (expected no-op with no socket)"

  required:
    name: required-test-jobs
    permissions:
      contents: read
    # Explicit membership keeps a deleted or renamed nested job from letting the
    # single protected ci-gate silently lose coverage.
    if: ${{ always() }}
    needs:
      [test, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: pixtuoid/.github/.github/actions/require-jobs@main
        with:
          results: ${{ toJSON(needs) }}
          label: "Required test job failed"
          allow-skipped: ${{ !inputs.full }}
