name: mutants

# ON-DEMAND only, and its own workflow rather than a job in ci.yml so a dispatch
# runs ONLY this. ADVISORY by construction: nothing `needs:` it, so a red run
# gates nothing — and cargo-mutants exits non-zero EXACTLY to signal surviving
# mutants, so that is NOT swallowed with continue-on-error.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    name: mutation testing (on-demand)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `--in-diff` needs the merge base in history
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          tools: cargo:cargo-mutants cargo-binstall aqua:nextest-rs/nextest/cargo-nextest
      # cargo-mutants builds its baseline with DEFAULT features — it needs
      # ALSA even where a reader assumes the flag-stripped release shape.
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-gpu
      # workflow_dispatch has no pull_request context, so MUTANTS_BASE is left
      # empty — `just mutants` falls back to its origin/main default.
      - name: Mutation-test the diff vs main (advisory, non-blocking)
        run: just mutants
      - name: Upload surviving-mutants report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-report
          path: mutants.out/
          retention-days: 7
          if-no-files-found: ignore
