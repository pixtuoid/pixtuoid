name: bench

# ON-DEMAND only, mirroring mutants.yml: a dispatch runs ONLY this, and nothing
# `needs:` it, so a slow run gates nothing. Shared-runner wall-clock is noise
# (https://bheisler.github.io/criterion.rs/book/faq.html), so this exists for
# trend evidence on request — the authoritative numbers are `just bench` runs
# on a quiet local machine, recorded in commit messages. It still earns its
# keep beside codspeed.yml: an x86 Linux wall-clock run is the one signal that
# can check an architecture-specific claim from an aarch64 dev machine, which
# instruction counting can't. `just bench-pacing` rides along: the TUI
# painter's frame time, overruns and bytes per frame, as `frame-pacing-report`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: frame, wire + pacing benchmarks (on-demand, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
      - name: Run frame + wire benchmarks (advisory, non-blocking)
        run: just bench
      # `bench-pacing` builds the binary, whose default `audio` feature links ALSA.
      - uses: ./.github/actions/setup-alsa
        if: always()
      - name: Run frame pacing (advisory, non-blocking)
        # Independent of the criterion run: either one failing keeps the other.
        if: always()
        run: just bench-pacing
      # JSON measurements only — the lean criterion feature set builds no HTML.
      - name: Upload criterion measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-measurements
          path: target/criterion/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload frame pacing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frame-pacing-report
          path: target/pacing/report.json
          retention-days: 14
          if-no-files-found: ignore
