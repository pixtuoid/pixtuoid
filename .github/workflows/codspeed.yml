name: codspeed

# Instrumented benchmark trend on Rust-touching PRs + main pushes, in TWO
# modes: `simulation` counts weighted instructions (not wall-clock, so
# shared-runner noise doesn't apply — <1% variance; ruff runs it too) and
# `memory` counts heap allocations. Ruff's step:
# https://github.com/astral-sh/ruff/blob/6dc81766a78f8d16a1020330417b46c3bfa26768/.github/workflows/ci.yaml#L1271-L1274
# ADVISORY by construction like
# bench.yml/mutants.yml: nothing `needs:` it, it is not a required check, and
# both action steps are `continue-on-error` — trend evidence, never a gate.
# Reports need the CodSpeed GitHub App installed on the repo; auth is OIDC
# (`id-token: write`, job-scoped per this repo's convention — see ci-tests.yml's
# "Declared, not inherited"), no token secret.
# Steps follow CodSpeed's documented criterion workflow; moonrepo/setup-rust
# installs cargo-codspeed via binstall (revisit if taiki-e/install-action adds
# it).
#
# TWO action steps rather than one `mode: simulation,memory`: the runner uploads
# only after EVERY mode's run part completes, so a single process drops an
# already-good simulation result whenever the newer memory instrument fails.
# The build takes no mode — both instruments consume the same build today.
on:
  # A PR compares against the latest base-branch commit that has a run
  # (codspeed.io/docs/features/understanding-the-metrics), so a main push that
  # touches no Rust needs none.
  push:
    branches: [main]
    paths: &rust-paths
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codspeed.yml"
  pull_request:
    # ready_for_review: the job skips drafts, so a PR's first trend point
    # lands when it leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *rust-paths

concurrency:
  group: codspeed-${{ github.ref }}
  # Same rule as ci.yml: never cancel an in-flight main run — it IS the trend
  # point.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codspeed:
    name: benchmarks (codspeed simulation + memory, advisory)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          channel: stable
          # Its release-target cache was the repository's largest (1.46 GB of
          # the 10 GB quota), and a cache past the quota evicts the required
          # jobs' caches by last access; this advisory job builds cold instead.
          cache: false
          bins: cargo-codspeed
      # Deliberately NOT continue-on-error: a bench that won't build is a
      # broken build, not a perf trend.
      # The binary's bench builds on its own with `just bench`'s features (no
      # ALSA): built with the others, its features would unify into their
      # dependencies and shift their trend. A build clears only the packages
      # it builds (cargo-codspeed 5.0.1 `build.rs:324-331`); the loop fails
      # closed should a release clear the first build's suites too.
      - name: Build instrumented benchmarks
        run: |
          cargo codspeed build -p pixtuoid-scene -p pixtuoid-core
          cargo codspeed build -p pixtuoid --no-default-features
          for pkg in pixtuoid-scene pixtuoid-core pixtuoid; do
            compgen -G "target/codspeed/*/$pkg/*" >/dev/null || { echo "::error::no $pkg bench suite was kept"; exit 1; }
          done
      # Non-required is not enough: a red step still reaches mergeStateStatus
      # (#964 sat gated on a red simulation while memory was already forgiven).
      - uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        continue-on-error: true
        with:
          mode: simulation
          run: cargo codspeed run
      - uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        continue-on-error: true
        with:
          mode: memory
          run: cargo codspeed run
          # Resident memory in a multi-threaded bench moves from run to run
          # with no code change; what the code asks the allocator for doesn't.
          disable-memory-track-physical: true
