# rust/cleartext-logging's `maybeAccountInfo` name heuristic reads each of these
# as account info; each returns an agent CLI's local session id.
extensions:
  - addsTo:
      pack: codeql/rust-all
      extensible: barrierModel
    data:
      - ["pixtuoid_core::source::decoder::hook_session_id", "ReturnValue", "log-injection", "manual"]
      - ["pixtuoid_core::source::kimi::kimi_session_id", "ReturnValue", "log-injection", "manual"]
      - ["pixtuoid_core::source::cc_probe::live_cc_session_ids", "ReturnValue", "log-injection", "manual"]
