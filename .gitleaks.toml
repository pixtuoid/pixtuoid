# Secret + recorder-identity scanning for the COMMITTED fixture tree.
#
# `just fixture-pii` points this pair at `crates/pixtuoid-core/tests/sources`, and
# only there: the sibling config's identity rules key on shapes that are leaks in
# a RECORDED CAPTURE and ordinary code everywhere else, so aiming them at the
# whole workspace would bury the signal in our own path strings.
#
# This replaced a hand-rolled scanner that admitted a real GitHub PAT, a GitLab
# PAT and a Stripe live key (measured, all three), because it only ever knew the
# five patterns its author thought of. `useDefault` brings gitleaks' whole
# corpus. The class gitleaks cannot know — the RECORDER's own machine identity,
# which is not a credential and so is invisible to every secret scanner including
# GitGuardian's — is the sibling config's job.

[extend]
useDefault = true

# The recorder-identity rules are NOT here: this config's default global
# allowlist waives filesystem-shaped strings, which is right for credentials and
# fatal for those rules. They live in `.gitleaks-identity.toml`, which says why.

# Wire identifiers that captured bytes legitimately carry. Without these,
# `generic-api-key` fires on every copilot message id.
[[allowlists]]
description = "Wire identifiers in recorded fixtures — not credentials"
# `secret`, not `match`, and ANCHORED — the two go together. Unanchored, these
# waive by SUBSTRING, so a real secret merely PREFIXED with a wire identifier
# (`msg_` + 40 random chars) is admitted. Anchoring against `match` instead reds
# every legitimate id, because the match carries the `"apiCallId":"…"` context
# while `secret` is exactly the id.
regexTarget = "secret"
regexes = [
  '''^msg_[0-9A-Za-z]{20,32}$''',
]
