[workspace]
resolver = "3"
members  = [
    "crates/pixtuoid-core",
    "crates/pixtuoid-scene",
    "crates/pixtuoid",
    "crates/pixtuoid-hook",
    "crates/pixtuoid-web",
]

[workspace.package]
version      = "0.20.0"
edition      = "2024"
license      = "MIT"
repository   = "https://github.com/pixtuoid/pixtuoid"
authors      = ["Ivan Wang <ivanwng97@icloud.com>"]
description  = "Terminal pixel-art office for AI coding agents"
homepage     = "https://github.com/pixtuoid/pixtuoid"
keywords     = ["terminal", "tui", "pixel-art", "ai-agents", "claude"]
categories   = ["command-line-utilities", "visualization"]

# `unreachable_pub` forces every `pub` in a private module tree down to
# `pub(crate)`, so a layer-internal item can't silently leak as crate API. Warn
# here; CI's `cargo clippy -- -D warnings` makes it a hard gate.
#
# `missing_docs` is NOT here on purpose: it is a PUBLIC-API gate, so it lives
# per-crate as `#![warn(missing_docs)]` in the two PUBLISHED crates' `lib.rs`,
# scoped identically to the semver-checks + api-surface gates.
[workspace.lints.rust]
unreachable_pub = "warn"
missing_debug_implementations = "warn"
# cargo-llvm-cov's own cfg (its README's recommended declaration).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

# An `allow` outlives the warning it silenced; an `expect` fails once its lint
# stops firing, and a `reason` says why the suppression exists.
[workspace.lints.clippy]
allow_attributes                = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks      = "warn"
# Picked from `pedantic` for the failure each prevents: an overflowing
# `(a + b) / 2`, a hand-rolled range check before a cast, an undocumented
# error or panic contract (the Rust API Guidelines' C-FAILURE), and an exported
# method's dropped `Self`, which leaves a `Copy` or borrowed receiver unchanged.
manual_midpoint                 = "warn"
checked_conversions             = "warn"
missing_errors_doc              = "warn"
missing_panics_doc              = "warn"
return_self_not_must_use        = "warn"
# A widening cast as `T::from`, which can't go silently lossy if a type changes.
cast_lossless                   = "warn"

# Rustdoc lints only fire during a doc build, so they're invisible to
# `cargo build`/`clippy`; CI's `docs` job runs `cargo doc` to execute them.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[profile.release]
lto           = true
codegen-units = 1
strip         = "debuginfo"
panic         = "abort"

# The browser engine (`just gen-wasm`). `release` is tuned for the native
# binary's speed; the wasm is a DOWNLOAD every visitor pays for before the hero
# goes live, its frame step is a rounding error against a frame budget and its
# synth runs in a worker — so it trades the other way. `z` vs `s` is empirical,
# not principled: `just gen-wasm-check` prints the size to re-judge it by.
[profile.wasm-release]
inherits  = "release"
opt-level = "z"

[profile.dev]
# Keep file:line in backtraces but drop the heavier variable/type debuginfo.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies never need debuginfo for our own backtraces.
debug = false

[profile.dev.package.pixtuoid-scene]
# The layout and pathfinding sweeps and the cutaway, cloud and outside paint
# tests are the workspace's compute-bound tests, and `test` inherits `dev`.
# Debug assertions stay ON. This cannot perturb foley's spectral pins: they
# compare centroid and band-energy shares within tolerances orders of magnitude
# wider than any codegen-level float difference.
opt-level = 2

# Opt-in full debuginfo for an actual debugger session:
# `cargo build --profile debugging`.
[profile.debugging]
inherits = "dev"
debug = true

# Iterating on a release build: `cargo run --profile release-local …`, into
# `target/release-local/`. Thin LTO over 16 incremental codegen units, where
# `release`'s fat LTO over one re-optimizes the whole program on every change.
# The scripts, `pace-check` and the shipped binary all read `target/release`,
# which this never writes.
[profile.release-local]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true

[workspace.dependencies]
# ratatui-core's copy, so no second crate.
lru                = { version = "0.18", default-features = false }
tokio              = { version = "1", default-features = false }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "1"
# Format-preserving TOML editing for config.toml saves: comments + unknown keys
# survive a round-trip.
toml_edit          = "0.25"
anyhow             = "1"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify             = "8"
pixtuoid-lofi      = "0.2"
ratatui            = "0.30"
crossterm          = "0.29"
# Terminal display-column width — the authority ratatui itself uses, so wide
# glyphs don't miscount against its layout.
unicode-width      = "0.2"
# Grapheme clusters, the unit ratatui's buffer writes a cell for.
unicode-segmentation = "1"
# Tests and the hermetic tier's literal census parse the source, so comments and strings never count.
syn                = { version = "3", default-features = false, features = ["full", "parsing", "visit"] }
proc-macro2        = { version = "1", default-features = false }
clap               = { version = "4", features = ["derive"] }
palette            = { version = "0.7", default-features = false, features = ["std"] }
chrono             = { version = "0.4", default-features = false }
foldhash           = { version = "0.2", default-features = false }
image              = { version = "0.25", default-features = false, features = ["png"] }
libc               = "0.2"
rustix             = "1"
# Already in the tree through ratatui; `IntoStaticStr` + `EnumString` write and
# read an enum's names from one declaration.
strum              = { version = "0.28", default-features = false, features = ["derive"] }
# A map keyed by every variant of an enum: a pack's pieces, each present.
enum-map           = "3.1"
# A Vec of at least one element: an animation's frames.
vec1               = { version = "1.12", features = ["serde"] }
semver             = "1"
# 0.61 to match the major tokio already pulls (via mio) on Windows — a second
# windows-sys major would double-compile the bindings.
windows-sys        = "0.61"
# Already in the tree through notify's walkdir: a Windows file id.
winapi-util        = "0.1"
criterion          = { package = "codspeed-criterion-compat", version = "6", default-features = false, features = ["cargo_bench_support"] }
insta              = "1"
schemars           = "1"
snapbox            = "1"
proptest           = "1"
tempfile           = "3"
# Dev-only: a path's canonical form without std's Windows `\\?\` prefix.
dunce              = "1"
# Dev-only: every test that sets or unsets an env var goes through it, behind
# one process-wide lock.
temp-env           = "0.3"
# Dev-only: the hermetic tier's `tui_drive` runs a CLI's TUI under a pty
# (ConPTY on Windows) and reads the screen it renders.
portable-pty       = "0.9"
vt100              = "0.18"
# Dev-only: `crates/pixtuoid-core/examples/support/bounded.rs`.
process-wrap       = { version = "10", default-features = false, features = ["std", "process-group", "job-object"] }
# Not crossterm's copy: holding to it would freeze this dev-only crate behind
# crossterm, a cost larger than its second compile.
signal-hook        = "0.4"
# regex is already built through criterion; sha2 checks the hermetic tier's
# release downloads, where a platform hasher would need a seam of its own to
# keep the sums check testable.
regex              = "1"
sha2               = { version = "0.11", default-features = false }
