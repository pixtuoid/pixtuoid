[package]
name                   = "pixtuoid-hook"
description            = "Lightweight hook shim for pixtuoid"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true
# A workspace-only test: it include_str!'s a sibling crate's source, which is
# absent from the published tarball, so shipping it would make `cargo test` fail
# on the .crate (publish itself is unaffected — its verify step builds, not tests).
exclude                = ["tests/pipe_quota_parity.rs"]

[lints]
workspace = true

[[bin]]
name = "pixtuoid-hook"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The client-side peer-cred check (#495) and the `cli_pid` ancestor walk (#528)
# need Win32 — verified decls beat hand-FFI in a never-panic shim.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
temp-env = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "net", "time", "io-util", "rt-multi-thread"] }

[package.metadata.deb]
section = "utils"
assets = [
    ["target/release/pixtuoid-hook", "usr/bin/", "755"],
    # cargo-deb's generated copyright names the license; MIT wants its text.
    ["../../LICENSE", "usr/share/doc/pixtuoid-hook/", "644"],
]
