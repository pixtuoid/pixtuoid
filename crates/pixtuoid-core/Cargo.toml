[package]
name                   = "pixtuoid-core"
description            = "Headless engine for pixtuoid — sources, state, sprites"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true
# Workspace-only tests that reach outside the crate for a sibling file absent
# from the published tarball — shipping them would make `cargo test` fail on the
# .crate. Runtime reads need excluding too: they spare the publish build-verify
# but not `cargo test` on an extracted crate. They stay FLAT so they can be
# excluded at all: a grouped binary's submodule cannot be excluded on its own.
exclude                = [
    # Recorded wire bytes — an operator's roster, instructions, session content —
    # that a crates.io tarball would freeze where the repo copy can still be
    # redacted; the grouped `sources` binary shares the dir and goes with them.
    # A tarball-contents choice, not a green-test one: the extracted crate's
    # `cargo test` is red regardless (`tests/watcher/sources.rs`, `tests/render/format.rs`).
    "tests/sources",
    "tests/pinned_by_claims.rs",
    "tests/socket_path_parity.rs",
    "tests/supported_sources_manifest.rs",
    "tests/proof_fixture_disjointness.rs",
]

[lints]
workspace = true

# `native` (default) pulls the whole source/ transport+watcher+probe machinery.
# Without it (`--no-default-features`) the pure core compiles to
# wasm32-unknown-unknown, which is what pixtuoid-scene's WebAssembly office hero
# builds against.
#
# `harness` (NON-default) adds the offline decode→reduce driver the
# fixture/corpus/fuzz/render call sites ride. Dev scaffolding: keeping it out of
# a default build keeps it out of `cargo public-api` + `cargo semver-checks`, so
# it never becomes a semver commitment.
[features]
default = ["native"]
native  = ["dep:tokio", "dep:notify"]
# The recorder writes captured lines back; without insertion order every
# rewritten object would come out alphabetized, an edit past the sanctioned one.
harness = [
    "serde_json/preserve_order",
    # The capture rig's host calls (`harness::{host, tap}`), kept off the
    # shipped build's feature set.
    "windows-sys/Win32_Storage_FileSystem",
    "windows-sys/Win32_System_Com",
    "windows-sys/Win32_System_Pipes",
    "windows-sys/Win32_System_Registry",
    "windows-sys/Win32_UI_Shell",
]
# What each source depends on upstream, for pixtuoid's drift watch and its
# tests: no shipped build reads it.
upstream = []

[dependencies]
tokio       = { workspace = true, features = ["sync", "rt", "macros", "fs", "net", "time", "io-util"], optional = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
notify      = { workspace = true, optional = true }
# `Rgb`'s OKLab: `ramp` and `mix`.
palette     = { workspace = true }
strum       = { workspace = true }
enum-map    = { workspace = true }
vec1        = { workspace = true }
# A CLI's version and its ordering, prerelease included: `registry::parse_version`.
semver      = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# Safe wrappers for the liveness/exit-watch syscalls the `native` probe layer
# makes: kqueue+kevent (macOS), pidfd_open+poll+self-pipe (Linux), kill(0).
# Unix-only like `libc`, so the wasm32 core build never sees it. libc STAYS for
# the macOS libproc calls rustix doesn't wrap (proc_pidinfo start-time in
# cc_probe, the fd→path table in fd_probe).
rustix = { workspace = true, features = ["event", "process", "pipe"] }

[target.'cfg(windows)'.dependencies]
# Win32_System_Threading: OpenProcess + GetProcessTimes, the `proc_start`
# creation-FILETIME marker (the Windows half of the pid-recycle guard), and
# `exit_watch`'s handle wait, whose cap is SystemServices' MAXIMUM_WAIT_OBJECTS.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
# Depending on ourselves BY PATH is how a crate turns its own non-default
# feature on for its dev targets — Cargo has no direct mechanism for it. The
# workspace `resolver` (v2's feature unification, which v3 keeps) keeps
# dev-dependency features out of a normal build (under v1 they would unify in
# and `harness` would ship).
pixtuoid-core = { path = ".", features = ["harness"] }
tokio = { workspace = true, features = ["sync", "rt", "macros", "fs", "net", "time", "io-util", "rt-multi-thread"] }
proptest = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }
filetime = "0.2"
regex = { workspace = true }
insta = { workspace = true, features = ["yaml"] }
tracing-subscriber = { workspace = true }
# Wire→state benchmarks (`just bench`); same CodSpeed compat passthrough as
# `pixtuoid-scene`'s.
criterion = { workspace = true }

[[bench]]
name = "decode_reduce"
harness = false

# Without this an example is not a test target, so its `#[test]`s build and
# never run — the same wiring `pixtuoid`'s `snapshot` example already carries.
[[example]]
name = "capture_fixture"
test = true

[[example]]
name = "hermetic"
test = true
