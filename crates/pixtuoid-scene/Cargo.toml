[package]
name                   = "pixtuoid-scene"
description            = "Backend-agnostic render + simulation engine for pixtuoid"
# Reads ../../site/src/sources.json at runtime, so `cargo test` on the
# extracted .crate would panic (no workspace tree).
exclude                = ["tests/site_badge_colors.rs", "tests/readme_chart_palette.rs"]
version.workspace      = true
edition.workspace      = true
# Fusion Pixel 8px, embedded: fonts/
license                = "MIT AND OFL-1.1"
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true

# `workspace = true` cannot be combined with per-crate lint tables (Cargo
# rejects the manifest), so this crate's `forbid(unsafe_code)` is a crate-root
# attribute in src/lib.rs instead.
[lints]
workspace = true

[features]
default        = ["pixel-font"]
# The Fusion Pixel face the cutaway sets baked world text and the floating
# window's screen text (`paint_grid`) in. A painter that sets the world text
# itself (`WorldText::Host`) still bakes it during a floor slide.
pixel-font     = []

[dependencies]
pixtuoid-core = { path = "../pixtuoid-core", version = "0.23.0", default-features = false }
pixtuoid-lofi = { workspace = true }
tracing       = { workspace = true }
lru           = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
# `TimeZone::system()`, the viewer's zone `localclock` reads local time in.
jiff          = { workspace = true, features = ["tz-system"] }
foldhash      = { workspace = true }
strum         = { workspace = true }
enum-map      = { workspace = true }
thiserror     = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
# `Rgb`'s OKLab: `ramp` and `mix`.
palette       = { workspace = true }
libm          = { workspace = true }
vec1          = { workspace = true }

# The tz database `TimeZone::system()` resolves the viewer's zone in: the
# system's (jiff 1.0.2 `PLATFORM.md:140-166`), bundled on Windows, which keeps
# none (`:291-313`). The site's wasm reads the page's offset instead. No database
# helps an iOS device, whose zone link is `/var/db/timezone/localtime` (Apple
# Libc `stdtime/FreeBSD/tzfile.h:52-57`) where jiff reads `/etc/localtime`
# (`src/tz/system/unix.rs:3`).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
jiff = { workspace = true, features = ["tzdb-zoneinfo"] }
[target.'cfg(windows)'.dependencies]
jiff = { workspace = true, features = ["tzdb-bundle-platform"] }

[build-dependencies]
toml       = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
anyhow     = { workspace = true }
proptest   = { workspace = true }
tempfile   = { workspace = true }
snapbox    = { workspace = true }
# tests/model_boundary.rs parses the source.
syn         = { workspace = true }
proc-macro2 = { workspace = true }
# The tests write packs in TOML; the loader reads their JSON transcode.
toml       = { workspace = true }
# The tests' manifest edits (`pack::density_art`, `test_office_with`).
toml_edit  = { workspace = true }
criterion  = { workspace = true }

[[bench]]
name = "render_frame"
harness = false

[[bench]]
name = "routing"
harness = false
