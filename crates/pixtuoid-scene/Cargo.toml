[package]
name                   = "pixtuoid-scene"
description            = "Backend-agnostic render + simulation engine for pixtuoid"
# Reads ../../site/src/sources.json at runtime, so `cargo test` on the
# extracted .crate would panic (no workspace tree).
exclude                = ["tests/site_badge_colors.rs", "tests/readme_chart_palette.rs"]
version.workspace      = true
edition.workspace      = true
# Fusion Pixel 8px, embedded: fonts/
license                = "MIT AND OFL-1.1"
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true

# `workspace = true` cannot be combined with per-crate lint tables (Cargo
# rejects the manifest), so this crate's `forbid(unsafe_code)` is a crate-root
# attribute in src/lib.rs instead.
[lints]
workspace = true

[features]
default        = ["native", "pixel-font"]
# Without it the render engine builds for wasm32 (no tokio/notify): the
# WebAssembly office hero.
native         = ["pixtuoid-core/native"]
# The Fusion Pixel face the cutaway sets baked world text and the floating
# window's screen text (`paint_grid`) in. A painter that sets the world text
# itself (`WorldText::Host`) still bakes it during a floor slide.
pixel-font     = []

[dependencies]
pixtuoid-core = { path = "../pixtuoid-core", version = "0.21.0", default-features = false }
pixtuoid-lofi = { workspace = true }
tracing       = { workspace = true }
lru           = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
# `clock` gives Local::now() w/ system timezone for the wall clock.
chrono        = { workspace = true, features = ["clock"] }
foldhash      = { workspace = true }
strum         = { workspace = true }
enum-map      = { workspace = true }
thiserror     = { workspace = true }

[build-dependencies]
toml       = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# `harness` is dev-only (see core's manifest), so `examples/corpus_check.rs`
# requests it here rather than in [dependencies].
pixtuoid-core = { path = "../pixtuoid-core", version = "0.21.0", default-features = false, features = ["harness", "pack-toml"] }
serde_json = { workspace = true }
proptest   = { workspace = true }
tempfile   = { workspace = true }
snapbox    = { workspace = true }
# tests/model_boundary.rs parses the source.
syn         = { workspace = true }
proc-macro2 = { workspace = true }
# The tests' manifest edits (`pack::density_art`, `test_office_with`).
toml_edit  = { workspace = true }
# Statistical render-path benchmarks (`just bench`). The CodSpeed compat
# package is a documented passthrough to real criterion when CodSpeed is
# inactive, so local `cargo bench` behaves as plain criterion; codspeed.yml
# instruments the same benches in CI. Lean feature set: no plotters/rayon.
criterion  = { workspace = true }

[[bench]]
name = "render_frame"
harness = false

[[example]]
name = "corpus_check"
required-features = ["native"]
test = true
