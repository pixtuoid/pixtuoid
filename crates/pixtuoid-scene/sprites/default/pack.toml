# Hairstyles and the line round every marked @Nx character:
# crates/pixtuoid-scene/AGENTS.md#the-sprite-format. The layers are scripts/gen-art.py's
# HAIRSTYLES, registered here by hand (`every_bundled_sprite_is_a_frame_the_pack_loads`
# fails on one left out).
[characters]
outline = "κ"

[hairstyles."bun@4x"]
front = { behind = "hair_bun_front_behind@4x.sprite", over = "hair_bun_front_over@4x.sprite" }
back = { behind = "hair_bun_back_behind@4x.sprite", over = "hair_bun_back_over@4x.sprite" }
side = { behind = "hair_bun_side_behind@4x.sprite", over = "hair_bun_side_over@4x.sprite" }
crown = { over = "hair_bun_crown_over@4x.sprite" }

