[palette]
"." = "transparent"
"H" = "#2a1a0e"   # hair (per-agent recolor target)
"S" = "#f4c79a"   # skin (per-agent recolor target)
"e" = "#1a1a1a"   # eyes
"m" = "#a04040"   # mouth
"B" = "#2e62cf"   # shirt (per-agent recolor target)
"P" = "#2a2e44"   # pants (per-agent recolor target — dark navy default)
"c" = "#7ed4e2"   # cyan accent
"j" = "#1c2a36"   # dark screen glass (`SCREEN_GLASS_KEY`)
"J" = "#34424e"   # dim screen content on idle glass; the cutaway relights it, as text, on a lit desk
"w" = "#ececec"   # off-white
"t" = "#d68a4a"   # orange tabby cat
"u" = "#3a2010"   # cat dark (ears, eyes, nose, tail tip)
"M" = "#3a3a40"   # charcoal
"E" = "#6e7280"   # brushed steel, between the wall and chrome (`K`)
"k" = "#1a1a22"   # near-black: a keyboard, feet and casters, pulls
"D" = "#8b5a2b"   # wood
"d" = "#5a3818"   # wood, shaded
"n" = "#3a2a1c"   # outline / nose shadow
"l" = "#4a8f3a"   # leaf green
"L" = "#2f6b25"   # plant leaf shadow
"g" = "#c2734f"   # terracotta
"C" = "#4f6d77"   # slate teal, cool against the warm floor
"G" = "#6a8e98"   # couch cushion highlight (lit upper surfaces)
"K" = "#a8a8b0"   # chrome
"V" = "#c8bea8"   # warm beige
"r" = "#a83232"   # red
"b" = "#3a5a9e"   # blue
"y" = "#c8a64c"   # ochre
"q" = "#1d1d1d"   # ink black
"x" = "#c8a060"   # tan
"z" = "#7a5030"   # dark brown
"R" = "#c45050"   # dog nose/tongue
"o" = "#d2402f"   # vermilion
"N" = "#9e2a20"   # dark red
"Q" = "#f0895a"   # lobster highlight (orange carapace)
"A" = "#e85540"   # lobster claw (lit)
"a" = "#c83828"   # lobster antenna
"T" = "#26262c"   # desk task-chair shell — cool near-black, so it parts from the warm desk
"I" = "#67676b"   # desk task-chair lit top edge (a flat shell reads as a hole in the floor)
# --- the generator's materials (scripts/gen-art.py): every @Nx piece and the
# 1x pieces it owns
"O" = "#b07a42"   # wood, lit
"σ" = "#c89058"   # wood, brightest edge
"ψ" = "#3e2710"   # wood, darkest
"ω" = "#d6a064"   # desk lamp's warm pool on the wood
"3" = "#4a4e5a"   # slate: a dark surface's lit edge
"4" = "#18191f"   # near-black: seams, cast shadow, a dark casing
"φ" = "#3c3e48"   # charcoal: keycaps and buttons
"6" = "#626470"   # mid grey
"7" = "#2e3038"   # gunmetal
"Θ" = "#5c606c"   # gunmetal, lit
"9" = "#ffe6a0"   # warm light: a bulb, a lit sign's panel
"!" = "#b8b2a4"   # off-white, shaded
"$" = "#969288"   # print: lines on paper, a spine's title
"%" = "#968c78"   # mug, shaded side
"/" = "#1e1f25"   # task-chair seat edge and base
"κ" = "#16121a"   # the @Nx art's outline: one near-black line round each piece's whole silhouette (the 1x art outlines in n)
"ρ" = "#4a2c18"   # coffee in a mug
# The city's materials ([city]): a painter colours each by depth and sky, so
# these are only what a painter that does not resolve them shows.
"+" = "#2a2e3c"   # a building's facade
"-" = "#1e212c"   # a facade turned from the light
"~" = "#3a3f50"   # a roof line or cornice
"0" = "#3c4152"   # a building's window glass
"|" = "#16181f"   # a mullion between panes
"*" = "#242733"   # rooftop plant: a tank, a mast, a unit
"=" = "#dc8250"   # a rooftop sign's panel
"¤" = "#d2d4d8"   # off-white: a night office has no pure white
";" = "#2a2226"   # shoe leather
":" = "#4a3e40"   # shoe, lit toe
"&" = "#e2e8f0"   # the brightest neutral, still short of pure white: a lit edge, a glint
"^" = "#e89a8a"   # pink: a sticky note
"Φ" = "#76b85c"   # leaf, lit
"Ψ" = "#1f4a1a"   # leaf midrib / darkest
"Γ" = "#8f4f33"   # terracotta pot, shaded
"δ" = "#de946c"   # terracotta pot, lit: its west side and rim
"ζ" = "#ff9f8a"   # petal highlight
"Π" = "#a4aab4"   # aluminium frame
"θ" = "#5e646e"   # aluminium, shaded
"Λ" = "#3a5058"   # couch fabric, shaded
"Ω" = "#2a3a40"   # couch fabric's seam: between cushions, inside the arms, the front rail
"λ" = "#5a8a4e"   # book spine, green
"Δ" = "#b8895a"   # cork
"π" = "#8a6440"   # cork grain
"ξ" = "#7c7c86"   # steel, shaded
"Ξ" = "#1c2a36"   # j's colour on a key the cutaway never relights: a TV's, a slide's glass
"Ж" = "#34424e"   # J's colour: a sheen on dark glass (a display, a microwave's window)
# The corridor appliances' keys, each recoloured from the theme's ApplianceColors
# (pack::appliance_overrides); the values are theme::normal's.
"Б" = "#323741"   # vending machine body
"П" = "#b43c3c"   # vending machine brand panel
"Ч" = "#dc3232"   # a vending machine's first drink
"Ш" = "#32a032"   # its second
"Щ" = "#3250c8"   # its third
"Э" = "#dcb428"   # its fourth
"Ф" = "#b4aa64"   # vending machine coin plate
"Ы" = "#282a30"   # vending machine glass and pickup recess
"Ю" = "#dcdce1"   # printer chassis
"Я" = "#3c3c44"   # printer lid
"Ё" = "#82b4c8"   # printer scanner glass
"Й" = "#f5f5f0"   # printer paper
"Ц" = "#b4b4b9"   # printer output tray
# The fixtures' keys, recoloured from the theme (pack::fixture_overrides);
# the values are theme::normal's.
"Д" = "#2e6f86"   # aquarium water
"З" = "#9adbe8"   # pale aqua
"И" = "#e0862f"   # the aquarium's first fish
"Л" = "#d94f1f"   # its second
"Ь" = "#3f8f3a"   # aquarium weed
"ж" = "#282a36"   # the aquarium's frame
"б" = "#3c4152"   # the water cooler's cabinet
"ы" = "#627ab2"   # a magazine's cover
"э" = "#323c5c"   # a magazine's edge
"ч" = "#c83c3c"   # the coat rack's first coat
"ш" = "#5078c8"   # its second
"щ" = "#f0f0f0"   # its third
"ф" = "#c8c8d2"   # the wall clock's rim
"ц" = "#f0f0f0"   # its face
"з" = "#141419"   # its hands, ticks and centre pin
# Un-themed (pack::COOLER_WATER).
"χ" = "#64b4e6"   # the water cooler's bottle
# An icon's ink, which the text's colour replaces (pack::ICON_INK_KEY).
"ι" = "#f0f0f0"

# Shades of a recolor key, derived from it: `level` steps along the key's ramp
# (`Rgb::ramp`). They carry no colour of their own, so a per-agent recolor
# re-derives every shade and shaded art keeps its shading.
[ramps]
"h" = { of = "H", level = -2 }   # hair, turned from the light
"Y" = { of = "H", level = 2 }    # hair, catching the light
"Z" = { of = "H", level = 5 }    # hair, curl highlight
"s" = { of = "S", level = -1 }   # skin, shaded
"i" = { of = "S", level = -3 }   # skin, deepest shade: the neck, the mouth, the collar
"v" = { of = "B", level = -2 }   # shirt, shaded
"W" = { of = "B", level = 2 }    # shirt, lit shoulder
"U" = { of = "B", level = -5 }   # shirt, deepest shade: a sleeve's crease
"ϊ" = { of = "ι", level = 4 }    # icon ink, lit: a lamp's glint
"ί" = { of = "ι", level = -4 }   # icon ink, dim: a dot's rounded corner, the clock's sides
"p" = { of = "P", level = -2 }   # pants, shaded
"(" = { of = "P", level = 2 }    # pants, lit thigh
"Ъ" = { of = "Б", level = 2 }    # vending machine body, lit top
"ъ" = { of = "Б", level = -2 }   # vending machine body, shaded east side
"п" = { of = "П", level = 3 }    # vending machine panel, lit
"ю" = { of = "Ю", level = -2 }   # printer chassis, shaded east side
"я" = { of = "Я", level = 2 }    # printer lid, lit edge
"й" = { of = "Й", level = -2 }   # printer paper, the stack's shaded edge
"д" = { of = "Д", level = -2 }   # aquarium water, deep
"и" = { of = "И", level = -2 }   # the first fish's belly and tail
"л" = { of = "Л", level = -2 }   # the second's
"ь" = { of = "Ь", level = -2 }   # aquarium weed, shaded
"ν" = { of = "ж", level = 2 }    # the aquarium's frame, lit top
"в" = { of = "б", level = 2 }    # the water cooler's cabinet, lit top
"ё" = { of = "б", level = -2 }   # the water cooler's cabinet, shaded east side
"α" = { of = "ч", level = -2 }   # the first coat, turned from the pole
"β" = { of = "ш", level = -2 }   # the second
"ţ" = { of = "t", level = -2 }   # the cat's fur, shaded
"Ţ" = { of = "t", level = 2 }    # the cat's fur, lit
"ƭ" = { of = "x", level = -2 }   # the dog's coat, shaded
"Ƭ" = { of = "x", level = 2 }    # the dog's coat, lit
"ȼ" = { of = "o", level = -2 }   # the lobster's shell, shaded
"Ȼ" = { of = "o", level = 2 }    # the lobster's shell, lit
"ǩ" = { of = "A", level = -2 }   # the lobster's claws, shaded
"Ǩ" = { of = "A", level = 2 }    # the lobster's claws, lit
"γ" = { of = "щ", level = -2 }   # the third
"η" = { of = "ф", level = 2 }    # the clock's rim, lit upper west
"ε" = { of = "ц", level = -2 }   # the clock's face, shaded lower east
"τ" = { of = "χ", level = -3 }   # the water cooler's bottle, shaded

[animations.seated]
frames   = ["seated.sprite"]
frame_ms = 600

# Density variants (`@Nx`): crates/pixtuoid-scene/AGENTS.md#the-sprite-format.
[animations."seated@4x"]
frames   = ["seated@4x.sprite"]
frame_ms = 600

[animations.seated_back]
frames   = ["seated_back.sprite"]
frame_ms = 600

[animations."seated_back@4x"]
frames   = ["seated_back@4x.sprite"]
frame_ms = 600

[animations.side_seated]
frames   = ["side_seated.sprite"]
frame_ms = 600

[animations."side_seated@4x"]
frames   = ["side_seated@4x.sprite"]
frame_ms = 600

[animations.typing]
frames   = ["typing_0.sprite", "typing_1.sprite"]
frame_ms = 125

[animations."typing@4x"]
