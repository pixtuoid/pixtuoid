# The city behind the windows: scripts/gen-art.py's BUILDINGS, registered here
# by hand (`every_bundled_sprite_is_a_frame_the_pack_loads` fails on one left
# out), each with the planes it stands in. A tower stands near, where it rises
# tallest; a low block only in the middle distance, behind the towers.
[city]
facade = "+"
shade = "-"
roof = "~"
glass = "0"
mullion = "|"
detail = "*"
sign = "="

[buildings.curtain]
sprite = "building_curtain.sprite"
planes = ["mid", "near"]

