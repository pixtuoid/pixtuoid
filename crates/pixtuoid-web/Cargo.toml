[package]
name        = "pixtuoid-web"
description  = "WebAssembly canvas painter over the pixtuoid-scene engine — the site's live offices"
# A site build input, never a crates.io artifact: this thin wasm shim must not
# enter the workspace's semver/release surface.
publish     = false
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true

[lints]
workspace = true

# cdylib = the wasm-bindgen artifact; rlib = so the pure sim logic is
# unit-testable natively.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# default-features = false → pixtuoid-core builds WITHOUT the native async
# runtime (no tokio/notify) → the whole graph compiles to wasm32.
pixtuoid-core  = { path = "../pixtuoid-core", version = "0.23.0", default-features = false }
pixtuoid-scene = { path = "../pixtuoid-scene", version = "0.23.0", default-features = false }
wasm-bindgen   = { workspace = true }
# Not its `js` feature: jiff finds the browser's zone only in a tz database it
# would bundle into this wasm (jiff 1.0.2 `PLATFORM.md:363-397`), so the page's
# own `Date` gives the offset.
jiff           = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }

[dev-dependencies]
# hero_still example only: PNG encode for the wasm-still posters.
image = { workspace = true }
