# Architecture invariant #1 (AGENTS.md): pixtuoid-core and pixtuoid-scene
# depend only on the crates below: any other crate fails until a PR lists it
# here with its reason, and a terminal, window or audio-device crate is never
# listed. `just arch` runs this against those two crates alone: `exclude` drops
# the binary and the two web crates, which depend on scene (an edge back would be
# a cycle cargo refuses), and the hook shim, which has no lib target to link.
# `all-features` plus every target holds each dep any feature or platform can
# pull. An entry nothing uses is not reported, so the list can outgrow the set.

[graph]
all-features = true
exclude-dev = true
exclude = ["pixtuoid", "pixtuoid-hook", "pixtuoid-web", "pixtuoid-web-music"]

[bans]
multiple-versions = "allow"
allow-workspace = true
allow = [
    # Direct dependencies of the two crates.
    "anyhow",
    "enum-map",
    "foldhash",
    "jiff",
    "libc",
    "libm",
    "lru",
    "mutatis",
    "notify",
    "palette",
    "pixtuoid-lofi",
    "regex",
    "rustix",
    "semver",
    "serde",
    "serde_json",
    "sha2",
    "strum",
    "thiserror",
    "tokio",
    "toml",
    "tracing",
    "unicode-segmentation",
    "unicode-width",
    "vec1",
    "windows-sys",
    # Transitive: pulled by the direct ones.
    "aho-corasick",
    "bitflags",
    "block-buffer",
    "by_address",
    "bytes",
    "cfg-if",
    "cpufeatures",
    "crypto-common",
    "digest",
    "enum-map-derive",
    "equivalent",
    "errno",
    "hashbrown",
    "heck",
    "hybrid-array",
    "indexmap",
    "inotify",
    "inotify-sys",
    "itoa",
    "jiff-core",
    "jiff-static",
    "kqueue",
    "kqueue-sys",
    "linux-raw-sys",
    "log",
    "memchr",
    "mio",
    "notify-types",
    "objc2-core-foundation",
    "objc2-core-services",
    "once_cell",
    "palette_derive",
    "palette_math",
    "pin-project-lite",
    "portable-atomic",
    "portable-atomic-util",
    "proc-macro2",
    "quote",
    "rand",
    "rand_core",
    "regex-automata",
    "regex-syntax",
    "same-file",
    "serde_core",
    "serde_derive",
    "serde_spanned",
    "socket2",
    "strum_macros",
    "syn",
    "thiserror-impl",
    "tokio-macros",
    "toml_datetime",
    "toml_parser",
    "toml_writer",
    "tracing-attributes",
