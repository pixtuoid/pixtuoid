disallowed-methods = [
    { path = "std::env::var", reason = "it drops a non-UTF-8 value, a legal path, and the resolver silently falls back elsewhere; read a location with `platform::path_env`, text with `platform::text_env` (the hook, which cannot depend on core: its `paths::path_env` twin, or `std::env::var_os`)" },
    { path = "std::env::vars", reason = "it panics on a non-UTF-8 entry; use `std::env::vars_os`" },
    { path = "open::with", reason = "it blocks the event loop until the launcher exits, as `open::that` does; call `open_url` (crate root), which detaches" },
    { path = "open::that", reason = "it blocks the event loop until the launcher exits (`xdg-open` on Linux waits for the browser); call `open_url` (crate root), which detaches" },
    { path = "chrono::TimeZone::with_ymd_and_hms", reason = "build a local instant with `pixtuoid_scene::localclock`'s helpers, a fixed one with `NaiveDate::and_hms_opt(..).and_utc()`" },
    { path = "chrono::TimeZone::from_local_datetime", reason = "build a local instant with `pixtuoid_scene::localclock`'s helpers, a fixed one with `NaiveDate::and_hms_opt(..).and_utc()`" },
    { path = "chrono::TimeZone::timestamp_opt", reason = "build a local instant with `pixtuoid_scene::localclock`'s helpers, a fixed one with `NaiveDate::and_hms_opt(..).and_utc()`" },
    { path = "chrono::TimeZone::timestamp_millis_opt", reason = "build a local instant with `pixtuoid_scene::localclock`'s helpers, a fixed one with `NaiveDate::and_hms_opt(..).and_utc()`" },
    { path = "chrono::NaiveDateTime::and_local_timezone", reason = "build a local instant with `pixtuoid_scene::localclock`'s helpers, a fixed one with `NaiveDate::and_hms_opt(..).and_utc()`" },
    { path = "chrono::TimeZone::timestamp_nanos", reason = "build a local instant with `pixtuoid_scene::localclock`'s helpers, a fixed one with `NaiveDate::and_hms_opt(..).and_utc()`" },
    { path = "chrono::TimeZone::timestamp_micros", reason = "build a local instant with `pixtuoid_scene::localclock`'s helpers, a fixed one with `NaiveDate::and_hms_opt(..).and_utc()`" },
    { path = "ratatui::Terminal::clear", reason = "ratatui-core 0.1.2's `Terminal::clear` asks the terminal where its cursor is (`ESC[6n`, ratatui#2694) before clearing, and one that never answers stalls the event loop for crossterm's whole timeout, then fails; repaint with `Terminal::resize` to the full size" },
    # std's `f32` and `f64` precision is "Unspecified" and varies by platform and Rust version (https://doc.rust-lang.org/std/primitive.f32.html, https://doc.rust-lang.org/std/primitive.f64.html), so a pinned frame differs across targets; `libm` is pure Rust that gives the same bits on every target this repo builds (its only arch overrides of these, in libm's src/math/arch/mod.rs, are x87 ones for x86 without SSE2).
