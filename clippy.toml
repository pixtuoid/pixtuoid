disallowed-methods = [
    # The fix is spelled in `reason`, never `replacement`: clippy offers that as a machine-applicable rewrite of the method's name alone (rust-1.99.0 `clippy_config/src/types.rs:144-157`), so `--fix` would turn `x.sin()` into `x.libm::sinf()`.
    { path = "std::env::var", reason = "it drops a non-UTF-8 value, a legal path, and the resolver silently falls back elsewhere; read a location with `platform::path_env`, text with `platform::text_env` (the hook, which cannot depend on core: its `paths::path_env` twin, or `std::env::var_os`)" },
    { path = "std::env::vars", reason = "it panics on a non-UTF-8 entry; use `std::env::vars_os`" },
    { path = "open::with", reason = "it blocks the event loop until the launcher exits, as `open::that` does; call `open_url` (crate root), which detaches" },
    { path = "open::that", reason = "it blocks the event loop until the launcher exits (`xdg-open` on Linux waits for the browser); call `open_url` (crate root), which detaches" },
    # These are every jiff 1.0.2 entry point that turns a civil time into a zoned one (`src/tz/timezone.rs:1136`, `:1189`, `src/civil/datetime.rs:1447`, `:1516`), plus the one that reads the viewer's zone (`src/tz/timezone.rs:334`): they back the `TimeZone::system` ban, which a type ban could never catch — jiff has no `Local` type, the zone is a value `system()` returns. `Timestamp::to_zoned_datetime` stays unbanned: an instant is already absolute, so it is the `to_utc` twin UTC sites use.
    { path = "jiff::tz::TimeZone::system", reason = "local time goes through `pixtuoid_scene::localclock` (outside scene, `pixtuoid_scene::tally::local_day`); UTC needs no zone: `Timestamp::to_zoned_datetime(TimeZone::UTC)`" },
    { path = "jiff::tz::TimeZone::to_zoned_datetime", reason = "local time goes through `pixtuoid_scene::localclock` (outside scene, `pixtuoid_scene::tally::local_day`); UTC needs no zone: `civil::DateTime::to_zoned_datetime(TimeZone::UTC)` under an `expect` naming UTC" },
    { path = "jiff::tz::TimeZone::to_ambiguous_zoned_datetime", reason = "local time goes through `pixtuoid_scene::localclock` (outside scene, `pixtuoid_scene::tally::local_day`); UTC needs no zone: `civil::DateTime::to_zoned_datetime(TimeZone::UTC)` under an `expect` naming UTC" },
    { path = "jiff::civil::DateTime::to_zoned_datetime", reason = "local time goes through `pixtuoid_scene::localclock` (outside scene, `pixtuoid_scene::tally::local_day`); UTC needs no zone: the same call with `TimeZone::UTC` under an `expect` naming UTC" },
    { path = "jiff::civil::DateTime::in_tz", reason = "local time goes through `pixtuoid_scene::localclock` (outside scene, `pixtuoid_scene::tally::local_day`); UTC needs no zone: `civil::DateTime::to_zoned_datetime(TimeZone::UTC)` under an `expect` naming UTC" },
    { path = "ratatui::Terminal::clear", reason = "ratatui-core 0.1.2's `Terminal::clear` asks the terminal where its cursor is (`ESC[6n`, ratatui#2694) before clearing, and one that never answers stalls the event loop for crossterm's whole timeout, then fails; repaint with `Terminal::resize` to the full size" },
    # std's `f32` and `f64` precision is "Unspecified" and varies by platform and Rust version (https://doc.rust-lang.org/std/primitive.f32.html, https://doc.rust-lang.org/std/primitive.f64.html), so a pinned frame differs across targets; `libm` is pure Rust that gives the same bits on every target this repo builds: its arch overrides are correctly rounded ops none of these bans name (sqrt, fma, rint, floor, ceil, trunc, fabs), plus x87 `exp*` on x86 without SSE2 (libm 0.2.16 `src/math/arch/mod.rs:10-55`), which no target this repo builds is (`.github/workflows/release.yml:77-91`, `:159-160`; `ci-builds.yml:29`, `:59`, `:72`).
