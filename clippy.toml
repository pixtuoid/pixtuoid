disallowed-macros = [
    { path = "snapbox::file", reason = "it resolves against the outermost Cargo.toml, so in a nested worktree it reads and overwrites the main checkout's golden; use `snapbox::Data::read_from` on a `CARGO_MANIFEST_DIR` path" },
]
disallowed-types = [
    # `Local` reads the runner's zone, so a test asserting on the hour passes on one machine and fails on another, which `localclock`'s unit-test build avoids by reading a fixed zone. The `chrono` constructors under disallowed-methods back this ban, which misses `Local` used as a value (`chrono::Local.timestamp_opt(..)`); clippy matches them on every zone. `allow-invalid`: pixtuoid-core's chrono has no `clock`, so `Local` doesn't exist when `just hack` lints core alone.
    { path = "chrono::Local", allow-invalid = true, reason = "read the viewer's zone through `pixtuoid_scene::localclock`" },
]
